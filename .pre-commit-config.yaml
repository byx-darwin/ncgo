minimum_pre_commit_version: '3.7.0'
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: end-of-file-fixer
        exclude: 'testdata/|\.proto$'
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: '^website/package-lock\.json$'

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'gofmt -w "$@"' --
        language: system
        types:
          - go
        require_serial: true

      - id: hermetic-unit-gate
        name: hermetic unit, vet, build, smoke
        entry: ./scripts/test-unit.sh
        language: system
        pass_filenames: false
        stages:
          - pre-push
