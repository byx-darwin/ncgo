name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Install code-gen tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install github.com/cloudwego/hertz/cmd/hz@v0.9.7
          go install github.com/cloudwego/kitex/tool/cmd/kitex@v0.16.1
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          protoc --version
          hz --version
          kitex --version
          sqlc version

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build CLI
        run: go build .

      - name: Smoke test
        run: ./scripts/smoke.sh

      - name: Verify polaris adapter compiles against pinned SDK
        run: ./scripts/verify-polaris-adapter.sh
