name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            version="snapshot-${GITHUB_SHA::7}"
          fi

          name="ncgo_${version}_${GOOS}_${GOARCH}"
          package_dir="dist/${name}"
          binary="ncgo"
          if [ "${GOOS}" = "windows" ]; then
            binary="ncgo.exe"
          fi

          mkdir -p "${package_dir}"
          go build -trimpath -ldflags "-s -w -X github.com/byx-darwin/ncgo/internal/cli.Version=${version}" -o "${package_dir}/${binary}" .
          cp README.md README.zh-CN.md "${package_dir}/"
          if [ -f LICENSE ]; then
            cp LICENSE "${package_dir}/"
          fi

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -r "${name}.zip" "${name}")
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ncgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  checksums:
    name: checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: ncgo-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lah dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes