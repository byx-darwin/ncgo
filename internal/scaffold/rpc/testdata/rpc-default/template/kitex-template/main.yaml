# Kitex custom template — main.go
# Generates the server entry point. Wiring lives in internal/base/server.
path: main.go
update_behavior:
  type: cover
body: |-
  // Code generated by kitex generator.

  package main

  import (
  	"log"

  	goclog "github.com/byx-darwin/go-tools/go-common/log"
  	"{{.Module}}/internal/base/conf"
  	"{{.Module}}/internal/base/server"
  )

  func main() {
  	if err := conf.Init(); err != nil {
  		log.Fatalf("load config: %+v", err)
  	}

  	cfg := conf.Get()
  	if err := goclog.Init(goclog.Config{
  		Level:  cfg.Log.Level,
  		Format: cfg.Log.Format,
  		Mode:   cfg.Log.Mode,
  	}, goclog.ReleaseInfo{
  		ServiceName: cfg.Server.Registry.Name,
  		Environment: cfg.Env,
  	}); err != nil {
  		log.Fatalf("init log: %+v", err)
  	}
  	defer goclog.Close()

  	server.Run()
  }
