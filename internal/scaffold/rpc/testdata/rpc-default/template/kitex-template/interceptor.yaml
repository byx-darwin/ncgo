# Kitex custom template — internal/pkg/interceptor
path: internal/pkg/interceptor/interceptor.go
update_behavior:
  type: cover
body: |-
  // Code generated by kitex generator.

  package interceptor

  import (
      "context"
      "crypto/rand"
      "encoding/hex"
      "errors"
      "time"

      "github.com/bytedance/gopkg/cloud/metainfo"
      "github.com/cloudwego/kitex/pkg/endpoint"
      "github.com/cloudwego/kitex/pkg/klog"

      "github.com/byx-darwin/go-tools/go-framework/kitex/middleware/compat"
      "{{.Module}}/internal/pkg/rpcerror"
  )

  const (
      HeaderRequestID     = "x-request-id"
      HeaderCallerService = "x-caller-service"
  )

  func RequestID() endpoint.Middleware {
      return func(next endpoint.Endpoint) endpoint.Endpoint {
          return func(ctx context.Context, req, resp interface{}) error {
              if RequestIDFromContext(ctx) == "" {
                  ctx = metainfo.WithPersistentValue(ctx, HeaderRequestID, newRequestID())
              }
              return next(ctx, req, resp)
          }
      }
  }

  // AccessLog delegates to go-framework/kitex/middleware/compat for standardized access logging.
  func AccessLog() endpoint.Middleware {
      return compat.AccessLog()
  }

  func Recovery() endpoint.Middleware {
      return func(next endpoint.Endpoint) endpoint.Endpoint {
          return func(ctx context.Context, req, resp interface{}) (err error) {
              defer func() {
                  if v := recover(); v != nil {
                      klog.CtxErrorf(ctx, "rpc panic recovered: %v", v)
                      err = rpcerror.ToBizError(rpcerror.InternalErrorf("panic: %v", v))
                  }
              }()
              return next(ctx, req, resp)
          }
      }
  }

  func RequestTimeout(timeout time.Duration) endpoint.Middleware {
      return func(next endpoint.Endpoint) endpoint.Endpoint {
          return func(ctx context.Context, req, resp interface{}) error {
              if timeout <= 0 {
                  return next(ctx, req, resp)
              }
              deadlineCtx, cancel := context.WithTimeout(ctx, timeout)
              defer cancel()
              err := next(deadlineCtx, req, resp)
              if errors.Is(deadlineCtx.Err(), context.DeadlineExceeded) && err == nil {
                  return rpcerror.ToBizError(rpcerror.TimeoutError())
              }
              return err
          }
      }
  }

  func CallerAllowlist(enabled bool, header string, allowedCallers []string, allowMissing bool) endpoint.Middleware {
      allowed := make(map[string]struct{}, len(allowedCallers))
      for _, caller := range allowedCallers {
          allowed[caller] = struct{}{}
      }
      if header == "" {
          header = HeaderCallerService
      }
      return func(next endpoint.Endpoint) endpoint.Endpoint {
          return func(ctx context.Context, req, resp interface{}) error {
              if !enabled {
                  return next(ctx, req, resp)
              }
              caller := MetaValue(ctx, header)
              if caller == "" {
                  if allowMissing {
                      return next(ctx, req, resp)
                  }
                  return rpcerror.ToBizError(rpcerror.PermissionDenied("caller service is missing"))
              }
              if _, ok := allowed[caller]; !ok {
                  return rpcerror.ToBizError(rpcerror.PermissionDenied("caller service is not allowed"))
              }
              return next(ctx, req, resp)
          }
      }
  }

  func RequestIDFromContext(ctx context.Context) string {
      return MetaValue(ctx, HeaderRequestID)
  }

  func MetaValue(ctx context.Context, key string) string {
      if value, ok := metainfo.GetPersistentValue(ctx, key); ok {
          return value
      }
      if value, ok := metainfo.GetValue(ctx, key); ok {
          return value
      }
      return ""
  }

  func newRequestID() string {
      var b [16]byte
      if _, err := rand.Read(b[:]); err != nil {
          return time.Now().UTC().Format("20060102150405.000000000")
      }
      return hex.EncodeToString(b[:])
  }
