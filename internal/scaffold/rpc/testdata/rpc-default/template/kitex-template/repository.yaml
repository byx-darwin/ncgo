# Kitex custom template — repository per service
# Generates internal/repository/{service}/repo.go for each service in the IDL.
# The repository wraps sqlc-generated query methods.
path: /internal/repository/{{ToLower .ServiceInfo.ServiceName}}/repo.go
update_behavior:
  type: skip
loop_service: true
body: |-
  // Code generated by kitex generator. Implement repository methods here.

  package {{.ServiceInfo.ServiceName | ToLower}}repo

  import (
      "context"

      goerror "github.com/byx-darwin/go-tools/go-common/error"
      frameworkerror "github.com/byx-darwin/go-tools/go-framework/error"
      "github.com/jackc/pgx/v5"
      "github.com/jackc/pgx/v5/pgxpool"

      "{{.Module}}/internal/db/gen"
  )

  // Repo implements the usecase port interface using sqlc-generated queries.
  // See internal/usecase/{{.ServiceInfo.ServiceName | ToLower}}/ for the interface definition.
  type Repo struct {
      q    *gen.Queries  // sqlc-generated query methods (internal/db/gen/)
      pool *pgxpool.Pool // native pgx pool — for transactions, batch, CopyFrom
  }

  // New creates a Repo backed by the given sqlc Queries and pgx pool.
  func New(q *gen.Queries, pool *pgxpool.Pool) *Repo {
      return &Repo{q: q, pool: pool}
  }

  // TODO: implement the methods declared in the usecase port interface.
  //
  // Example:
  //
  //   func (r *Repo) FindByID(ctx context.Context, id int64) (gen.{{.ServiceInfo.ServiceName}}, error) {
  //       return r.q.Get{{.ServiceInfo.ServiceName}}ByID(ctx, id)
  //   }
  //
  // Run `make sqlc` after editing internal/db/query/*.sql to refresh generated code.

  // WithTx executes fn inside a database transaction.
  func (r *Repo) WithTx(ctx context.Context, fn func(*Repo) error) (err error) {
      tx, err := r.pool.BeginTx(ctx, pgx.TxOptions{})
      if err != nil {
          return goerror.
              In("{{.ServiceInfo.ServiceName | ToLower}}.repository").
              Tags("database", "postgres", "transaction").
              Code(frameworkerror.CodeSystem).
              Public("database transaction failed").
              Wrapf(err, "begin transaction")
      }
      committed := false
      defer func() {
          if committed {
              return
          }
          if p := recover(); p != nil {
              _ = tx.Rollback(ctx)
              panic(p)
          }
          if err != nil {
              _ = tx.Rollback(ctx)
          }
      }()
      txRepo := &Repo{q: r.q.WithTx(tx), pool: r.pool}
      if err := fn(txRepo); err != nil {
          return goerror.
              In("{{.ServiceInfo.ServiceName | ToLower}}.repository").
              Tags("database", "postgres", "transaction").
              Code(frameworkerror.CodeSystem).
              Public("database transaction failed").
              Wrapf(err, "transaction callback")
      }
      if err := tx.Commit(ctx); err != nil {
          return goerror.
              In("{{.ServiceInfo.ServiceName | ToLower}}.repository").
              Tags("database", "postgres", "transaction").
              Code(frameworkerror.CodeSystem).
              Public("database transaction failed").
              Wrapf(err, "commit transaction")
      }
      committed = true
      return nil
  }
