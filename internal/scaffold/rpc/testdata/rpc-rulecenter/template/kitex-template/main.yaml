# Kitex custom template — main.go
# Generates the server entry point. Wiring lives in internal/base/server.
path: main.go
update_behavior:
  type: cover
body: |-
  // Code generated by kitex generator.

  package main

  import (
      "log"

      "{{.Module}}/internal/base/conf"
    "{{.Module}}/internal/base/server"
  )

  func main() {
      if err := conf.Init(); err != nil {
          log.Fatalf("load config: %+v", err)
      }
      server.Run()
  }
