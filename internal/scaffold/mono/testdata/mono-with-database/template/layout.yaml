          func CodeMsg(err error) (int, string) {
        code := CodeInternalError
              public := ""
              msg := "internal_error"
          if oe, ok := oops.AsOops(err); ok {
                  code = codeFromOops(oe.Code(), code)
              if value := oe.Public(); value != "" {
                      public = value
              }
          }
              if def, ok := DefinitionFromCode(code); ok {
                  return code, def.Msg
              }
              if public != "" {
                  return code, public
              }
              return code, msg
          }

          func codeFromOops(value any, fallbackCode int) int {
              if value == nil {
                  return fallbackCode
              }
              switch v := value.(type) {
              case int:
                  return v
              case int64:
                  return int(v)
              case int32:
                  return int(v)
              case uint:
                  return int(v)
              case uint64:
                  return int(v)
              case uint32:
                  return int(v)
              case string:
                  if parsed, err := strconv.Atoi(v); err == nil {
                      return parsed
                  }
                  return fallbackCode
              default:
                  if parsed, err := strconv.Atoi(fmt.Sprint(v)); err == nil {
                      return parsed
                  }
                  return fallbackCode
              }
      }

