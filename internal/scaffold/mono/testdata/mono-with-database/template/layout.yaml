          case CodeUnsupportedMediaType:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusUnsupportedMediaType}, true
          case CodeRouteNotFound:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusNotFound}, true
          case CodeMethodNotAllowed:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusMethodNotAllowed}, true
          case CodeNotImplemented:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusNotImplemented}, true
          case CodeRequestTimeout:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusGatewayTimeout}, true
          case CodeUnauthorized, CodeSignatureMissing, CodeSignatureExpired, CodeTokenMissing,
