      package data

      {{ if .WithDatabase}}
      import (
          "context"

          "github.com/jackc/pgx/v5/pgxpool"
          "github.com/samber/oops"

          "{{.GoModule}}/internal/db/gen"
      )

      // Data holds shared infrastructure clients.
      // Add optional clients (Redis / Kafka / ES / ClickHouse) by copying files
      // from this skill's assets/optional/ directory into this package.
      type Data struct {
          Pool    *pgxpool.Pool // native pgx pool — supports Batch, CopyFrom, LISTEN/NOTIFY
          Queries *gen.Queries  // sqlc-generated query methods
      }

      // New initialises core infrastructure connections.
      // Wire up via samber/do in internal/base/server/server.go.
      func New(pool *pgxpool.Pool) (*Data, func(), error) {
          queries := gen.New(pool)
          cleanup := func() {
              pool.Close()
          }
          return &Data{Pool: pool, Queries: queries}, cleanup, nil
      }

      // NewPostgres opens and validates a PostgreSQL connection pool via native pgx/v5.
      // Pass the full *pgxpool.Config via samber/do so every pool option is available.
      func NewPostgres(ctx context.Context, cfg *pgxpool.Config) (*pgxpool.Pool, error) {
          if cfg == nil {
              return nil, oops.
                  In("postgres").
                  Tags("database", "postgres", "connection").
                  Code(10308).
                  Public("config_invalid").
                  New("pgxpool.Config is nil")
          }
          pool, err := pgxpool.NewWithConfig(ctx, cfg)
          if err != nil {
              return nil, oops.
                  In("postgres").
                  Tags("database", "postgres", "connection").
                  Code(10303).
                  Public("database_unavailable").
                  With("max_conns", cfg.MaxConns).
                  With("min_conns", cfg.MinConns).
                  Wrapf(err, "pgxpool.NewWithConfig")
          }
          if err := pool.Ping(ctx); err != nil {
              pool.Close()
              return nil, oops.
                  In("postgres").
                  Tags("database", "postgres", "connection").
                  Code(10303).
                  Public("database_unavailable").
                  With("max_conns", cfg.MaxConns).
                  With("min_conns", cfg.MinConns).
                  Wrapf(err, "pool.Ping")
          }
          return pool, nil
      }

      // NewPostgresConfig parses a DSN into pgxpool.Config.
      // Mutate the returned config in conf/server wiring to set MaxConns, MinConns,
      // MaxConnLifetime, MaxConnIdleTime, HealthCheckPeriod, ConnConfig, hooks, etc.
      func NewPostgresConfig(dsn string) (*pgxpool.Config, error) {
          if dsn == "" {
              return nil, oops.
                  In("postgres").
                  Tags("database", "postgres", "configuration").
                  Code(10308).
                  Public("config_invalid").
                  New("postgres DSN is empty")
          }
          cfg, err := pgxpool.ParseConfig(dsn)
          if err != nil {
              return nil, oops.
                  In("postgres").
                  Tags("database", "postgres", "configuration").
                  Code(10308).
                  Public("config_invalid").
                  Wrapf(err, "pgxpool.ParseConfig")
          }
          return cfg, nil
      }
      {{ else}}
      // Data is intentionally empty for pure BFF services.
      // Use adapters for downstream RPC calls; copy optional add-ons only when needed.
      type Data struct{}

      // New initialises shared infrastructure for BFF-only services.
      func New() (*Data, func(), error) {
          return &Data{}, func() {}, nil
      }
      {{ end}}

  - path: internal/base/data/tx.go
    delims: ["{{", "}}"]
    body: |-
      package data

      {{ if .WithDatabase}}
      import (
          "context"

          "github.com/jackc/pgx/v5"
          "github.com/jackc/pgx/v5/pgxpool"
          "github.com/samber/oops"

          "{{.GoModule}}/internal/db/gen"
      )

      type TxFunc func(ctx context.Context, q *gen.Queries) error

      // WithTx runs fn in a database transaction using default pgx transaction options.
      func WithTx(ctx context.Context, pool *pgxpool.Pool, fn TxFunc) error {
          return WithTxOptions(ctx, pool, pgx.TxOptions{}, fn)
      }

      // WithTxOptions runs fn in a database transaction and commits only when fn succeeds.
      // Rollback is attempted for fn errors and panics; panics are re-thrown after rollback.
      func WithTxOptions(ctx context.Context, pool *pgxpool.Pool, opts pgx.TxOptions, fn TxFunc) (err error) {
          if pool == nil {
              return txConfigError("pgxpool.Pool is nil")
          }
          if fn == nil {
              return txConfigError("transaction callback is nil")
          }
          tx, err := pool.BeginTx(ctx, opts)
          if err != nil {
              return txDatabaseError(err, "begin transaction")
          }
          committed := false
          defer func() {
              if recovered := recover(); recovered != nil {
                  _ = tx.Rollback(ctx)
                  panic(recovered)
              }
              if !committed {
                  _ = tx.Rollback(ctx)
              }
          }()

          q := gen.New(tx)
          if err := fn(ctx, q); err != nil {
              return err
          }
          if err := tx.Commit(ctx); err != nil {
              return txDatabaseError(err, "commit transaction")
          }
          committed = true
          return nil
      }

      // WithTx runs fn in a transaction using the Data pool.
      func (d *Data) WithTx(ctx context.Context, fn TxFunc) error {
          if d == nil {
              return txConfigError("data is nil")
          }
          return WithTx(ctx, d.Pool, fn)
      }

      // WithTxOptions runs fn in a transaction using the Data pool and explicit pgx options.
      func (d *Data) WithTxOptions(ctx context.Context, opts pgx.TxOptions, fn TxFunc) error {
          if d == nil {
              return txConfigError("data is nil")
          }
          return WithTxOptions(ctx, d.Pool, opts, fn)
      }

      func txConfigError(message string) error {
          return oops.In("postgres.tx").Tags("database", "postgres", "transaction").Code(10308).Public("config_invalid").New(message)
      }

      func txDatabaseError(err error, operation string) error {
          return oops.In("postgres.tx").Tags("database", "postgres", "transaction").Code(10303).Public("database_unavailable").With("operation", operation).Wrapf(err, "database transaction failed")
      }
      {{ else}}
      // Transaction helpers are generated only when WithDatabase=true.
      {{ end}}

