  # ── pkg/middleware: request id and access log ─────────────────────────────
  - path: internal/pkg/middleware/observability.go
    delims: ["{{", "}}"]
    body: |-
      package middleware

      import (
          "context"
          "crypto/rand"
          "encoding/hex"
          "errors"
          "time"

          "github.com/cloudwego/hertz/pkg/app"
          "github.com/cloudwego/hertz/pkg/common/hlog"
          "github.com/cloudwego/hertz/pkg/protocol/consts"

          "{{.GoModule}}/internal/pkg/response"
      )

      const (
          HeaderRequestID    = "X-Request-ID"
          ContextKeyRequestID = "request_id"
      )

      func RequestID() app.HandlerFunc {
          return func(ctx context.Context, c *app.RequestContext) {
              requestID := c.Request.Header.Get(HeaderRequestID)
              if requestID == "" {
                  requestID = newRequestID()
              }
              c.Set(ContextKeyRequestID, requestID)
              c.Response.Header.Set(HeaderRequestID, requestID)
              c.Next(ctx)
          }
      }

      func AccessLog() app.HandlerFunc {
          return func(ctx context.Context, c *app.RequestContext) {
              started := time.Now()
              c.Next(ctx)
              status := c.Response.StatusCode()
              if status == 0 {
                  status = consts.StatusOK
              }
              hlog.CtxInfof(ctx, "access method=%s path=%s status=%d latency=%s request_id=%s",
                  c.Method(), c.Path(), status, time.Since(started), RequestIDFromContext(c))
          }
      }

      // RequestTimeout adds a per-request context deadline for handlers, usecases,
      // database queries, and downstream calls that respect context cancellation.
      // It cannot safely kill business goroutines; code must propagate ctx.
      func RequestTimeout(timeout time.Duration) app.HandlerFunc {
          return func(ctx context.Context, c *app.RequestContext) {
              if timeout <= 0 {
                  c.Next(ctx)
                  return
              }
              deadlineCtx, cancel := context.WithTimeout(ctx, timeout)
              defer cancel()
              c.Next(deadlineCtx)
              if errors.Is(deadlineCtx.Err(), context.DeadlineExceeded) && !c.IsAborted() {
                  response.ErrorCode(c, response.CodeRequestTimeout)
                  c.Abort()
              }
          }
      }

      func RequestIDFromContext(c *app.RequestContext) string {
          value, ok := c.Get(ContextKeyRequestID)
          if !ok {
              return ""
          }
          requestID, _ := value.(string)
          return requestID
      }

      func newRequestID() string {
          var b [16]byte
          if _, err := rand.Read(b[:]); err != nil {
              return time.Now().UTC().Format("20060102150405.000000000")
          }
          return hex.EncodeToString(b[:])
      }

