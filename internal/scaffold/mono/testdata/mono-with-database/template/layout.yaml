          if c.Auth.Signature.Enabled && c.Auth.Signature.Nonce.Enabled {
              switch c.Auth.Signature.Nonce.Backend {
              case "", "memory", "redis":
              default:
                  return oops.In("config").Code(10308).Public("config_invalid").New("auth.signature.nonce.backend must be memory or redis")
              }
              if c.Auth.Signature.Nonce.Backend == "redis" && len(c.Auth.Signature.Nonce.Redis.Addrs) == 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("auth.signature.nonce.redis.addrs is empty")
              }
              if c.Auth.Signature.Nonce.Backend == "memory" && c.Auth.Signature.Nonce.Memory.MaxEntries < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("auth.signature.nonce.memory.max_entries must not be negative")
              }
              if c.Auth.Signature.Nonce.TTLSeconds < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("auth.signature.nonce.ttl_seconds must not be negative")
              }
          }
          if c.Auth.Token.Enabled && c.Auth.Token.SigningKey == "" {
              return oops.In("config").Code(10308).Public("config_invalid").New("auth.token.signing_key is empty")
          }
          if c.CORS.Enabled && c.CORS.AllowCredentials && hasWildcard(c.CORS.AllowOrigins) {
              return oops.In("config").Code(10308).Public("config_invalid").New("cors.allow_credentials cannot be true when allow_origins contains *")
          }
          if c.RateLimit.Enabled {
              switch c.RateLimit.Backend {
              case "", "memory", "redis":
              default:
                  return oops.In("config").Code(10308).Public("config_invalid").New("rate_limit.backend must be memory or redis")
              }
              if c.RateLimit.Backend == "redis" && len(c.RateLimit.Redis.Addrs) == 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("rate_limit.redis.addrs is empty")
              }
              if c.RateLimit.Backend == "memory" && c.RateLimit.Memory.MaxEntries < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("rate_limit.memory.max_entries must not be negative")
              }
              if !c.RateLimit.PreAuth.Enabled && !c.RateLimit.PostAuth.Enabled {
                  return oops.In("config").Code(10308).Public("config_invalid").New("at least one rate_limit rule must be enabled")
              }
              if err := validateRateLimitRule("rate_limit.pre_auth", c.RateLimit.PreAuth); err != nil {
                  return err
              }
              if err := validateRateLimitRule("rate_limit.post_auth", c.RateLimit.PostAuth); err != nil {
                  return err
              }
          }
          if c.Idempotency.Enabled {
              switch c.Idempotency.Backend {
              case "", "memory", "redis":
              default:
                  return oops.In("config").Code(10308).Public("config_invalid").New("idempotency.backend must be memory or redis")
              }
              if c.Idempotency.Backend == "redis" && len(c.Idempotency.Redis.Addrs) == 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("idempotency.redis.addrs is empty")
              }
              if c.Idempotency.Backend == "memory" && c.Idempotency.Memory.MaxEntries < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("idempotency.memory.max_entries must not be negative")
              }
              if c.Idempotency.TTLSeconds < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("idempotency.ttl_seconds must not be negative")
              }
              if c.Idempotency.MaxBodyBytes < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("idempotency.max_body_bytes must not be negative")
              }
          }
          return nil
      }

      func validateRateLimitRule(name string, rule RateLimitRuleConfig) error {
          if !rule.Enabled {
              return nil
          }
          if rule.RequestsPerSecond <= 0 {
              return oops.In("config").Code(10308).Public("config_invalid").New(name + ".requests_per_second must be positive")
          }
          if rule.Burst <= 0 {
              return oops.In("config").Code(10308).Public("config_invalid").New(name + ".burst must be positive")
          }
          return nil
      }

      func hasWildcard(values []string) bool {
          for _, value := range values {
              if strings.TrimSpace(value) == "*" {
                  return true
              }
          }
          return false
      }

      func Env() string {
          if env := os.Getenv("GO_ENV"); env != "" {
              return env
          }
          return "dev"
      }

