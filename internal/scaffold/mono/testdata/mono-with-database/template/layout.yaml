          }
          if cfg.RateLimit.Enabled && cfg.RateLimit.PreAuth.Enabled {
              h.Use(middleware.RateLimit(cfg.RateLimit, cfg.RateLimit.PreAuth))
          }
          h.NoRoute(middleware.NoRoute)
          h.NoMethod(middleware.NoMethod)

          authSkipper := middleware.PathSkipper(cfg.Auth.PublicPaths...)

          if cfg.Auth.Signature.Enabled {
              h.Use(middleware.Unless(middleware.SignatureAuth(
                  cfg.Auth.Signature,
                  middleware.StaticSecretResolver{SecretValue: cfg.Auth.Signature.StaticSecret},
              ), authSkipper))
          }
          if cfg.Auth.Token.Enabled {
              h.Use(middleware.Unless(middleware.JWTAuth(cfg.Auth.Token), authSkipper))
          }
          if cfg.RateLimit.Enabled && cfg.RateLimit.PostAuth.Enabled {
              h.Use(middleware.RateLimit(cfg.RateLimit, cfg.RateLimit.PostAuth))
          }
          if cfg.Idempotency.Enabled {
              h.Use(middleware.Idempotency(cfg.Idempotency))
          }

          health.Register(h)
          if cfg.Swagger.Enabled {
              registerSwaggerRoutes(h, cfg.Swagger)
          }

          // Register routes generated by hz from the IDL annotations.
          router.GeneratedRegister(h)

          h.Spin()
      }

      func serverDurationSeconds(value int) time.Duration {
          if value <= 0 {
              return 0
          }
          return time.Duration(value) * time.Second
      }

      func registerSwaggerRoutes(h *server.Hertz, cfg conf.SwaggerConfig) {
          basePath := normalizeSwaggerPath(cfg.Path)
          specRoute := basePath + "/openapi.yaml"

          h.GET(basePath+"/*any", swaggerui.WrapHandler(
              swaggerFiles.Handler,
              swaggerui.URL(specRoute),
          ))
          h.GET(specRoute, func(ctx context.Context, c *app.RequestContext) {
              body, err := os.ReadFile(cfg.SpecFile)
              if err != nil {
                  c.String(consts.StatusServiceUnavailable, "swagger spec not generated; run `make swagger`")
                  return
              }
              c.Header("Content-Type", "application/x-yaml")
              _, _ = c.Write(body)
          })
      }

      func normalizeSwaggerPath(value string) string {
          value = strings.TrimSpace(value)
          if value == "" || value == "/" {
              return "/swagger"
          }
          return "/" + strings.Trim(value, "/")
      }

  # ── router/register.go (required by hz, do not delete) ──────────────────
  - path: internal/router/register.go
    delims: ["", ""]
    body: |-
      // Code generated by hertz generator. DO NOT EDIT.

      package router

      import (
          "github.com/cloudwego/hertz/pkg/app/server"
      )

      // GeneratedRegister registers routers generated by IDL.
      func GeneratedRegister(r *server.Hertz) {
          //INSERT_POINT: DO NOT DELETE THIS LINE!
      }

  # ── Makefile ─────────────────────────────────────────────────────────────
  - path: Makefile
    delims: ["{{", "}}"]
    body: |
      APP_NAME = {{.ServiceName}}
      MODULE   = {{.GoModule}}
      GOOSE_DRIVER ?= postgres
      GOOSE_DBSTRING ?= $(DATABASE_URL)
      GOOSE_MIGRATION_DIR ?= internal/db/migrations

      .PHONY: build run dev update swagger generate sqlc migrate-create migrate-up migrate-down migrate-status lint test check tidy clean install-tools

      # ── Build ──────────────────────────────────────────────────────────────
      build: ; @echo "Building $(APP_NAME)..."; mkdir -p output/bin; go build -o output/bin/$(APP_NAME) .; echo "Build complete → output/bin/$(APP_NAME)"

      run: build ; @./output/bin/$(APP_NAME)

      dev: ; @which air > /dev/null 2>&1 && air || go run .

      # ── Code generation ────────────────────────────────────────────────────
      # Re-run after modifying any .proto IDL file.
      # router_dir is persisted in .hz from the initial hz new command.
      update: ; @echo "Generating Hertz code from IDL..."; hz update --idl=idl/app/{{.ServiceName}}.proto -I idl --handler_dir=internal/handler --model_dir=internal/pb --customize_package=template/package.yaml; echo "Code generation complete"

      swagger: ; @echo "Generating Swagger docs from IDL..."; mkdir -p internal/docs/swagger; protoc --http-swagger_out=internal/docs/swagger -I idl idl/app/{{.ServiceName}}.proto && rm -f internal/docs/swagger/swagger.go && echo "Swagger generation complete → internal/docs/swagger"

      sqlc: ; @echo "Generating sqlc code..."; sqlc generate -f internal/db/sqlc.yaml

      migrate-create: ; @test -n "$(name)" || (echo "usage: make migrate-create name=create_users" && exit 1); goose -dir $(GOOSE_MIGRATION_DIR) create $(name) sql

      migrate-up: ; @test -n "$(GOOSE_DBSTRING)" || (echo "DATABASE_URL is required" && exit 1); goose -dir $(GOOSE_MIGRATION_DIR) $(GOOSE_DRIVER) "$(GOOSE_DBSTRING)" up

      migrate-down: ; @test -n "$(GOOSE_DBSTRING)" || (echo "DATABASE_URL is required" && exit 1); goose -dir $(GOOSE_MIGRATION_DIR) $(GOOSE_DRIVER) "$(GOOSE_DBSTRING)" down

      migrate-status: ; @test -n "$(GOOSE_DBSTRING)" || (echo "DATABASE_URL is required" && exit 1); goose -dir $(GOOSE_MIGRATION_DIR) $(GOOSE_DRIVER) "$(GOOSE_DBSTRING)" status

      generate: update swagger sqlc ; @echo "All code generation complete"

      # ── Quality ────────────────────────────────────────────────────────────
      lint: ; @golangci-lint run ./...

      test: ; @go test -race -count=1 ./...

      check: lint test

      # ── Dependencies ───────────────────────────────────────────────────────
      tidy: ; @go mod tidy

      # ── Install tools ──────────────────────────────────────────────────────
      install-tools: ; @echo "Installing development tools..."; go install github.com/cloudwego/hertz/cmd/hz@latest; go install github.com/hertz-contrib/swagger-generate/protoc-gen-http-swagger@latest; go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest; go install github.com/pressly/goose/v3/cmd/goose@latest; go install github.com/air-verse/air@latest; go install golang.org/x/tools/cmd/goimports@latest; command -v protoc > /dev/null 2>&1 || echo "Warning: protoc is required for make swagger"; echo "Install complete"

      # ── Cleanup ────────────────────────────────────────────────────────────
      clean: ; @rm -rf output/
