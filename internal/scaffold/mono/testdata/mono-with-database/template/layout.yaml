          }
          for _, tt := range cases {
              if got := MsgFromCode(tt.code); got != tt.msg {
                  t.Fatalf("MsgFromCode(%d) = %q, want %q", tt.code, got, tt.msg)
              }
              if got := StatusFromCode(tt.code); got != tt.status {
