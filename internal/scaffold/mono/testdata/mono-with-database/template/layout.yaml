          case CodeDependencyError, CodeDatabaseUnavailable, CodeCacheUnavailable,
              CodeMessageQueueUnavailable, CodeSearchUnavailable, CodeStorageUnavailable:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusServiceUnavailable}, true
          default:
              return Definition{}, false
          }
      }

      func builtinMsg(code int) string {
          switch code {
          case CodeOK:
              return "ok"
          case CodeInternalError:
              return "internal_error"
          case CodeRequestBindFailed:
              return "request_bind_failed"
          case CodeRequestValidateFailed:
              return "request_validate_failed"
          case CodeRequestParamMissing:
              return "request_param_missing"
          case CodeRequestParamInvalid:
              return "request_param_invalid"
          case CodeRequestBodyInvalid:
              return "request_body_invalid"
          case CodeRequestBodyTooLarge:
              return "request_body_too_large"
          case CodeUnsupportedMediaType:
              return "unsupported_media_type"
          case CodeRouteNotFound:
              return "route_not_found"
          case CodeMethodNotAllowed:
              return "method_not_allowed"
          case CodeNotImplemented:
              return "not_implemented"
          case CodeRequestTimeout:
              return "request_timeout"
          case CodeUnauthorized:
              return "unauthorized"
          case CodeSignatureMissing:
              return "signature_missing"
          case CodeSignatureExpired:
              return "signature_expired"
          case CodeSignatureInvalid:
              return "signature_invalid"
          case CodeTokenMissing:
              return "token_missing"
          case CodeTokenInvalid:
              return "token_invalid"
          case CodeTokenExpired:
              return "token_expired"
          case CodeClaimsInvalid:
              return "token_claims_invalid"
          case CodePermissionDenied:
              return "permission_denied"
          case CodeAppKeyInvalid:
              return "app_key_invalid"
          case CodeSessionInvalid:
              return "session_invalid"
          case CodeRateLimited:
              return "rate_limited"
          case CodeDuplicateRequest:
              return "duplicate_request"
          case CodeReplayRequest:
              return "replay_request"
          case CodeIdempotencyKeyMissing:
              return "idempotency_key_missing"
          case CodeIdempotencyConflict:
              return "idempotency_conflict"
          case CodeDependencyError:
              return "dependency_error"
          case CodeRPCFailed:
              return "rpc_failed"
          case CodeRPCTimeout:
              return "rpc_timeout"
          case CodeDatabaseUnavailable:
              return "database_unavailable"
          case CodeCacheUnavailable:
              return "cache_unavailable"
          case CodeMessageQueueUnavailable:
              return "message_queue_unavailable"
          case CodeSearchUnavailable:
              return "search_unavailable"
          case CodeStorageUnavailable:
              return "storage_unavailable"
          case CodeConfigInvalid:
              return "config_invalid"
          case CodeDataDecodeFailed:
