# Hertz custom template — main.go
# Generates the server entry point. Uses go-common/log for structured logging.
path: main.go
update_behavior:
  type: cover
body: |-
  package main

  import (
  	goclog "github.com/byx-darwin/go-tools/go-common/log"

  	"{{.Module}}/internal/base/conf"
  	"{{.Module}}/internal/base/server"
  )

  func main() {
  	if err := conf.Init(); err != nil {
  		goclog.L().Fatal("load config", "error", err)
  	}

  	cfg := conf.Get()
  	if err := goclog.Init(goclog.Config{
  		Level:  cfg.Log.Level,
  		Format: cfg.Log.Format,
  		Mode:   cfg.Log.Mode,
  	}, goclog.ReleaseInfo{
  		ServiceName: cfg.Server.Registry.Name,
  		Environment: cfg.Env,
  	}); err != nil {
  		goclog.L().Fatal("init log", "error", err)
  	}
  	defer goclog.Close()

  	server.Run()
  }
