# Generated by ncgo for local development.
# Containers use conf/docker/conf.yaml via GO_ENV=docker; host-side development keeps using conf/dev/conf.yaml.
# Optional config-center profiles:
#   docker compose --profile config-center-nacos up --build
#   docker compose --profile config-center-polaris up --build
name: demo
services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GO_ENV: docker
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/demo?sslmode=disable
    depends_on:
      - postgres
    ports:
      - "8080:8080"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  nacos:
    image: nacos/nacos-server:v2.5.2
    profiles:
      - config-center-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
  polaris:
    image: polarismesh/polaris-server-standalone:v1.18.1
    profiles:
      - config-center-polaris
    ports:
      - "8080:8080"
      - "8090:8090"
      - "8091:8091"
      - "8093:8093"
      - "8761:8761"
      - "9000:9000"
      - "9090:9090"
      - "15010:15010"
volumes:
  postgres-data:
