syntax = "proto3";

package app;

option go_package = "github.com/x/demo/internal/pb;pb";

import "api.proto";
import "openapi/annotations.proto";

option (openapi.document) = {
  info: {
    title: "Demo API";
    version: "v1";
    description: "Generated by ncgo for Hertz HTTP APIs.";
  };
};

message PingReq {
  string name = 1 [
    (api.query) = "name",
    (openapi.parameter) = { required: true },
    (openapi.property) = {
      title: "Name";
      description: "Ping 请求中的 name 查询参数";
      type: "string";
      min_length: 1;
      max_length: 64;
    }
  ];
}

message PingResp {
  option (openapi.schema) = {
    title: "Ping response";
    description: "Ping 接口返回结果";
    required: ["message"];
  };

  string message = 1 [
    (openapi.property) = {
      title: "Response message";
      description: "服务返回的响应文本";
      type: "string";
      min_length: 1;
      max_length: 128;
    }
  ];
}

service DemoService {
  rpc Ping(PingReq) returns (PingResp) {
    option (api.get) = "/ping";
    option (openapi.operation) = {
      summary: "Ping";
      description: "基础连通性测试接口";
    };
  }
}
