# Custom hz package template — struct-based handler delegating to usecase
# Usage: hz update --idl=idl/svc.proto --customize_package=template/package.yaml
#
# This overrides the default handler.go to produce:
#   - A Handler struct (not bare functions)
#   - Methods that bind the request then call h.uc.<Method>(ctx, &req)
#   - A usecase stub file alongside the handler
layouts:
  # ── handler.go (overrides default) ──────────────────────────────────────
  - path: handler.go
    delims: ["{{", "}}"]
    body: |-
      // Code generated by hertz generator.

      package {{.PackageName}}

      import (
          "context"

          "github.com/cloudwego/hertz/pkg/app"
          goerror "github.com/byx-darwin/go-tools/go-common/error"

          "{{$.ProjPackage}}/internal/pkg/response"

      {{- range $k, $v := .Imports}}
          {{$k}} "{{$v.Package}}"
      {{- end}}
      )

      // Handler handles HTTP requests. It delegates business logic to UseCase.
      type Handler struct {
          uc useCase
      }

      // useCase is the port this handler depends on.
      // Implement it in internal/usecase/{{.PackageName}}/.
      type useCase interface {
      {{- range $_, $m := .Methods}}
          {{$m.Name}}(ctx context.Context, req *{{$m.RequestTypeName}}) (*{{$m.ReturnTypeName}}, error)
      {{- end}}
      }

      type notImplementedUseCase struct{}

      {{range $_, $m := .Methods}}
      func (notImplementedUseCase) {{$m.Name}}(ctx context.Context, req *{{$m.RequestTypeName}}) (*{{$m.ReturnTypeName}}, error) {
          _ = ctx
          _ = req
          return nil, goerror.
              In("{{$.PackageName}}.usecase").
                  Code(response.CodeNotImplemented).
                  Public("not_implemented").
              Errorf("{{$m.Name}}: not implemented")
      }
      {{end}}

      // New{{.PackageName | title}}Handler creates a Handler wired to the given usecase.
      func New{{.PackageName | title}}Handler(uc useCase) *Handler {
          return &Handler{uc: uc}
      }

      // DefaultHandler is used by hz-generated package-level route functions.
      // Replace it during server wiring with New{{.PackageName | title}}Handler(realUseCase).
      var DefaultHandler = New{{.PackageName | title}}Handler(notImplementedUseCase{})

      {{range $_, $m := .Methods}}
      {{$m.Comment}}
      func {{$m.Name}}(ctx context.Context, c *app.RequestContext) {
          DefaultHandler.{{$m.Name}}(ctx, c)
      }

      {{$m.Comment}}
      func (h *Handler) {{$m.Name}}(ctx context.Context, c *app.RequestContext) {
          {{if ne $m.RequestTypeName "" -}}
          var req {{$m.RequestTypeName}}
          if err := c.BindAndValidate(&req); err != nil {
              response.BindError(c, err)
              return
          }
          resp, err := h.uc.{{$m.Name}}(ctx, &req)
          {{- else}}
          resp, err := h.uc.{{$m.Name}}(ctx, nil)
          {{- end}}
          if err != nil {
              response.Err(c, err)
              return
          }
          response.OK(c, resp)
      }
      {{end}}

  # ── handler_single.go (used when updating existing handler file) ─────────
  - path: handler_single.go
    delims: ["{{", "}}"]
    body: |+
      {{.Comment}}
      func (h *Handler) {{.Name}}(ctx context.Context, c *app.RequestContext) {
          {{if ne .RequestTypeName "" -}}
          var req {{.RequestTypeName}}
          if err := c.BindAndValidate(&req); err != nil {
              response.BindError(c, err)
              return
          }
          resp, err := h.uc.{{.Name}}(ctx, &req)
          {{- else}}
          resp, err := h.uc.{{.Name}}(ctx, nil)
          {{- end}}
          if err != nil {
              response.Err(c, err)
              return
          }
          response.OK(c, resp)
      }
