      func TestBuildKeyByAppKey(t *testing.T) {
          lookup := Lookup{AppKey: "app-1", ClientIP: "127.0.0.1", Path: "/ping"}
          if got, want := BuildKey(lookup, []string{"ak", "ip"}, "test"), "test:ak:app-1"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestBuildKeyByAppKeyPath(t *testing.T) {
          lookup := Lookup{AppKey: "app-1", ClientIP: "127.0.0.1", Path: "/ping"}
          if got, want := BuildKey(lookup, []string{"ak_path", "ip"}, "test"), "test:ak_path:app-1:/ping"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestBuildKeyByUserUUIDClaims(t *testing.T) {
          lookup := Lookup{AppKey: "app-1", UserUUID: "user-1", ClientIP: "127.0.0.1", Path: "/ping"}
          if got, want := BuildKey(lookup, []string{"ak_user_uuid", "user_uuid", "ip"}, "test"), "test:ak_user_uuid:app-1:user-1"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestBuildKeyByIP(t *testing.T) {
          lookup := Lookup{ClientIP: "10.0.0.1", Path: "/ping"}
          if got, want := BuildKey(lookup, []string{"ip"}, "test"), "test:ip:10.0.0.1"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestBuildKeyByPath(t *testing.T) {
          lookup := Lookup{ClientIP: "127.0.0.1", Path: "/orders"}
          if got, want := BuildKey(lookup, []string{"path"}, "rl"), "rl:path:/orders"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestBuildKeyByMethodPath(t *testing.T) {
          lookup := Lookup{Method: "GET", Path: "/orders", ClientIP: "127.0.0.1"}
          if got, want := BuildKey(lookup, []string{"method_path"}, "rl"), "rl:method_path:GET:/orders"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestBuildKeyByAKMethodPath(t *testing.T) {
          lookup := Lookup{AppKey: "app-1", Method: "POST", Path: "/orders", ClientIP: "127.0.0.1"}
          if got, want := BuildKey(lookup, []string{"ak_method_path"}, "rl"), "rl:ak_method_path:app-1:POST:/orders"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestBuildKeyFallsBackToIPWhenDimensionEmpty(t *testing.T) {
          lookup := Lookup{ClientIP: "127.0.0.1", Path: "/ping"}
          // ak is empty, so ak falls through; ip matches.
          if got, want := BuildKey(lookup, []string{"ak", "ip"}, "test"), "test:ip:127.0.0.1"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestBuildKeyFallsBackWhenNoDimensionMatches(t *testing.T) {
          lookup := Lookup{ClientIP: "10.0.0.1", Path: "/ping"}
          // keyBy has a dimension not in the switch; falls through loop → default ip key.
          if got, want := BuildKey(lookup, []string{"unknown_dim"}, "rl"), "rl:ip:10.0.0.1"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestBuildKeySanitizesSpecialCharacters(t *testing.T) {
          lookup := Lookup{AppKey: "app:1", ClientIP: "127.0.0.1", Path: "/ping"}
          if got, want := BuildKey(lookup, []string{"ak"}, "rl"), "rl:ak:app_1"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestMemoryStoreEvictsLRU(t *testing.T) {
          store := NewStore(conf.RateLimitConfig{Backend: "memory", Memory: conf.MemoryCacheConfig{MaxEntries: 1}}, nil)
          rule := conf.RateLimitRuleConfig{Enabled: true, Strategy: "fixed_window", WindowSeconds: config.Duration{Duration: 60 * time.Second}, MaxRequests: 1, ClientTTLSeconds: config.Duration{Duration: 60 * time.Second}}
          if ok, err := store.Allow(context.Background(), "k1", rule); err != nil || !ok {
              t.Fatalf("allow k1 = %v, %v", ok, err)
          }
          if ok, err := store.Allow(context.Background(), "k2", rule); err != nil || !ok {
              t.Fatalf("allow k2 = %v, %v", ok, err)
          }
          if ok, err := store.Allow(context.Background(), "k1", rule); err != nil || !ok {
              t.Fatalf("allow evicted k1 = %v, %v; want fresh bucket after LRU eviction", ok, err)
          }
      }

      func TestNewStoreBackendSelection(t *testing.T) {
          memStore := NewStore(conf.RateLimitConfig{Backend: "memory"}, nil)
          if memStore == nil {
              t.Fatal("memory store should not be nil")
          }
          // redis backend with nil client falls back to memory.
          fallbackStore := NewStore(conf.RateLimitConfig{Backend: "redis"}, nil)
          if fallbackStore == nil {
              t.Fatal("fallback store should not be nil when redis client is nil")
          }
      }

  # ── pkg/middleware: idempotency ─────────────────────────────────────────────
  - path: internal/pkg/middleware/idempotency.go
    delims: ["{{", "}}"]
    body: |-
      package middleware

      import (
          "context"
          "crypto/sha256"
          "encoding/json"
          "encoding/hex"
          "strings"
          "sync"
          "time"

          "github.com/cloudwego/hertz/pkg/app"
          "github.com/redis/go-redis/v9"
              "github.com/samber/hot"
          config "github.com/byx-darwin/go-tools/go-framework/config"

          "{{.GoModule}}/internal/base/conf"
          "{{.GoModule}}/internal/pkg/response"
      )

      const (
          idempotencyStateProcessing = "processing"
          idempotencyStateCompleted  = "completed"
          headerIdempotencyReplayed  = "X-Idempotency-Replayed"
      )

      type idempotencyRecord struct {
          State       string `json:"state"`
          Status      int    `json:"status,omitempty"`
          ContentType string `json:"content_type,omitempty"`
          Body        []byte `json:"body,omitempty"`
          Fingerprint string `json:"fingerprint,omitempty"`
          ExpiresAt   int64  `json:"expires_at"`
      }

      type idempotencyStore interface {
          Begin(ctx context.Context, key string, fingerprint string, ttl time.Duration) (*idempotencyRecord, bool, error)
          Complete(ctx context.Context, key string, record idempotencyRecord, ttl time.Duration) error
          Release(ctx context.Context, key string) error
      }

      type memoryIdempotencyStore struct {
              mu     sync.Mutex
              values *hot.HotCache[string, idempotencyRecord]
      }

      type redisIdempotencyStore struct {
          client redis.UniversalClient
      }

      func Idempotency(cfg conf.IdempotencyConfig) app.HandlerFunc {
          cfg = normalizeIdempotencyConfig(cfg)
          skipper := PathSkipper(cfg.SkipPaths...)
          methods := idempotencyMethods(cfg.Methods)
          store := newIdempotencyStore(cfg)
          ttl := cfg.TTLSeconds.Duration
          return func(ctx context.Context, c *app.RequestContext) {
              if !cfg.Enabled || skipper(ctx, c) || !methods[string(c.Method())] {
                  c.Next(ctx)
                  return
              }
              requestKey := strings.TrimSpace(c.Request.Header.Get(cfg.Header))
              if requestKey == "" {
                  response.ErrorCode(c, response.CodeIdempotencyKeyMissing)
                  c.Abort()
                  return
              }
              key := idempotencyKey(c, cfg, requestKey)
              fingerprint := idempotencyFingerprint(c)
              existing, acquired, err := store.Begin(ctx, key, fingerprint, ttl)
              if err != nil {
                  if cfg.FailOpen {
                      c.Next(ctx)
                      return
                  }
                  response.ErrorCode(c, response.CodeCacheUnavailable)
                  c.Abort()
                  return
              }
              if !acquired {
                  if existing != nil && existing.Fingerprint != "" && existing.Fingerprint != fingerprint {
                      response.ErrorCode(c, response.CodeIdempotencyConflict)
                      c.Abort()
                      return
                  }
                  if existing != nil && existing.State == idempotencyStateCompleted {
                      replayIdempotencyResponse(c, *existing)
                      c.Abort()
                      return
                  }
                  response.ErrorCode(c, response.CodeDuplicateRequest)
                  c.Abort()
                  return
              }

              c.Next(ctx)

              status := c.Response.StatusCode()
              body := append([]byte(nil), c.Response.Body()...)
              if !idempotencyCacheableStatus(status) || (cfg.MaxBodyBytes > 0 && len(body) > cfg.MaxBodyBytes) {
                  _ = store.Release(ctx, key)
                  return
              }
              record := idempotencyRecord{
                  State:       idempotencyStateCompleted,
                  Status:      status,
                  ContentType: string(c.Response.Header.ContentType()),
                  Body:        body,
                  Fingerprint: fingerprint,
                  ExpiresAt:   time.Now().Add(ttl).Unix(),
              }
              if err := store.Complete(ctx, key, record, ttl); err != nil && !cfg.FailOpen {
                  response.ErrorCode(c, response.CodeCacheUnavailable)
                  c.Abort()
                  return
              }
          }
      }

      func newIdempotencyStore(cfg conf.IdempotencyConfig) idempotencyStore {
          if cfg.Backend == "redis" {
              return &redisIdempotencyStore{client: sharedRedisClient(cfg.Redis)}
          }
              return newMemoryIdempotencyStore(cfg.Memory.MaxEntries)
      }

          func newMemoryIdempotencyStore(maxEntries int) *memoryIdempotencyStore {
              return &memoryIdempotencyStore{values: hot.NewHotCache[string, idempotencyRecord](hot.LRU, memoryCacheMaxEntries(maxEntries)).Build()}
          }

      func (s *memoryIdempotencyStore) Begin(ctx context.Context, key string, fingerprint string, ttl time.Duration) (*idempotencyRecord, bool, error) {
          _ = ctx
          if ttl <= 0 {
              ttl = 24 * time.Hour
          }
          now := time.Now()
          expiresAt := now.Add(ttl)
          s.mu.Lock()
          defer s.mu.Unlock()
              if record, found, err := s.values.Get(key); err != nil {
                  return nil, false, err
              } else if found {
              if record.ExpiresAt > now.Unix() {
                  copied := cloneIdempotencyRecord(record)
                  return &copied, false, nil
              }
                  s.values.Delete(key)
          }
              s.values.SetWithTTL(key, idempotencyRecord{State: idempotencyStateProcessing, Fingerprint: fingerprint, ExpiresAt: expiresAt.Unix()}, ttl)
          return nil, true, nil
      }

      func (s *memoryIdempotencyStore) Complete(ctx context.Context, key string, record idempotencyRecord, ttl time.Duration) error {
          _ = ctx
          if ttl <= 0 {
              ttl = 24 * time.Hour
          }
          record.ExpiresAt = time.Now().Add(ttl).Unix()
          s.mu.Lock()
          defer s.mu.Unlock()
              s.values.SetWithTTL(key, cloneIdempotencyRecord(record), ttl)
          return nil
      }

      func (s *memoryIdempotencyStore) Release(ctx context.Context, key string) error {
          _ = ctx
          s.mu.Lock()
          defer s.mu.Unlock()
              s.values.Delete(key)
          return nil
      }

      func (s *redisIdempotencyStore) Begin(ctx context.Context, key string, fingerprint string, ttl time.Duration) (*idempotencyRecord, bool, error) {
          if ttl <= 0 {
              ttl = 24 * time.Hour
          }
          payload, _ := json.Marshal(idempotencyRecord{State: idempotencyStateProcessing, Fingerprint: fingerprint, ExpiresAt: time.Now().Add(ttl).Unix()})
          ok, err := s.client.SetNX(ctx, key, payload, ttl).Result()
          if err != nil {
              return nil, false, err
          }
          if ok {
              return nil, true, nil
          }
          value, err := s.client.Get(ctx, key).Bytes()
          if err == redis.Nil {
              return &idempotencyRecord{State: idempotencyStateProcessing}, false, nil
          }
          if err != nil {
              return nil, false, err
          }
          record := idempotencyRecord{}
          if err := json.Unmarshal(value, &record); err != nil {
              return nil, false, err
          }
          return &record, false, nil
      }

      func (s *redisIdempotencyStore) Complete(ctx context.Context, key string, record idempotencyRecord, ttl time.Duration) error {
          if ttl <= 0 {
              ttl = 24 * time.Hour
          }
          record.ExpiresAt = time.Now().Add(ttl).Unix()
          payload, err := json.Marshal(record)
          if err != nil {
              return err
          }
          return s.client.Set(ctx, key, payload, ttl).Err()
      }

      func (s *redisIdempotencyStore) Release(ctx context.Context, key string) error {
          return s.client.Del(ctx, key).Err()
      }

      func replayIdempotencyResponse(c *app.RequestContext, record idempotencyRecord) {
          if record.Status <= 0 {
              record.Status = response.StatusFromCode(response.CodeDuplicateRequest)
          }
          c.Response.SetStatusCode(record.Status)
          if record.ContentType != "" {
              c.Response.Header.SetContentType(record.ContentType)
          }
          c.Response.Header.Set(headerIdempotencyReplayed, "true")
          c.Response.SetBody(record.Body)
      }

      func idempotencyKey(c *app.RequestContext, cfg conf.IdempotencyConfig, requestKey string) string {
          scope := "ip:" + requestIP(c)
          if claims, ok := GetClaims(c); ok {
              switch {
              case claims.AK != "" && claims.UUID != "":
                  scope = "ak_user_uuid:" + claims.AK + ":" + claims.UUID
              case claims.UUID != "":
                  scope = "user_uuid:" + claims.UUID
              case claims.AK != "":
                  scope = "ak:" + claims.AK
              }
          } else if ak := strings.TrimSpace(c.Request.Header.Get(cfg.AppKeyHeader)); ak != "" {
              scope = "ak:" + ak
          }
          return joinRateLimitKey(cfg.KeyPrefix, scope, string(c.Method()), string(c.Path()), requestKey)
      }

      func idempotencyFingerprint(c *app.RequestContext) string {
          hash := sha256.New()
          _, _ = hash.Write(c.Method())
          _, _ = hash.Write([]byte("\n"))
          _, _ = hash.Write(c.Path())
          _, _ = hash.Write([]byte("\n"))
          _, _ = hash.Write(c.Request.URI().QueryString())
          _, _ = hash.Write([]byte("\n"))
          _, _ = hash.Write(c.Request.Body())
          return hex.EncodeToString(hash.Sum(nil))
      }

      func idempotencyMethods(values []string) map[string]bool {
          if len(values) == 0 {
              values = []string{"POST", "PUT", "PATCH", "DELETE"}
          }
          out := make(map[string]bool, len(values))
          for _, value := range values {
              value = strings.ToUpper(strings.TrimSpace(value))
              if value != "" {
                  out[value] = true
              }
          }
          return out
      }

      func idempotencyCacheableStatus(status int) bool {
          return status >= 200 && status < 300
      }

      func cloneIdempotencyRecord(record idempotencyRecord) idempotencyRecord {
          record.Body = append([]byte(nil), record.Body...)
          return record
      }

      func normalizeIdempotencyConfig(cfg conf.IdempotencyConfig) conf.IdempotencyConfig {
          if cfg.Backend == "" {
              cfg.Backend = "memory"
          }
          if cfg.Header == "" {
              cfg.Header = "X-Idempotency-Key"
          }
          if cfg.AppKeyHeader == "" {
              cfg.AppKeyHeader = "X-App-Key"
          }
          if cfg.KeyPrefix == "" {
              cfg.KeyPrefix = "idempotency"
          }
          if cfg.TTLSeconds.Duration <= 0 {
              cfg.TTLSeconds = config.Duration{Duration: 86400 * time.Second}
          }
          if cfg.MaxBodyBytes <= 0 {
              cfg.MaxBodyBytes = 1048576
          }
              if cfg.Memory.MaxEntries <= 0 {
                  cfg.Memory.MaxEntries = defaultMemoryCacheMaxEntries
              }
          if cfg.Backend == "redis" && len(cfg.Redis.Addrs) == 0 {
              cfg.Redis.Addrs = []string{"127.0.0.1:6379"}
          }
          return cfg
      }

  - path: internal/pkg/middleware/idempotency_test.go
    delims: ["{{", "}}"]
    body: |-
      package middleware

      import (
          "context"
          "testing"
          "time"

          "github.com/cloudwego/hertz/pkg/app"
          "github.com/cloudwego/hertz/pkg/protocol"
          "github.com/cloudwego/hertz/pkg/protocol/consts"

          "{{.GoModule}}/internal/base/conf"
      )

      func TestMemoryIdempotencyStoreReplaysCompletedRecord(t *testing.T) {
          store := newMemoryIdempotencyStore(100)
          if existing, acquired, err := store.Begin(context.Background(), "key", "fp-1", time.Minute); err != nil || !acquired || existing != nil {
              t.Fatalf("first begin = (%+v, %v, %v), want acquired", existing, acquired, err)
          }
          record := idempotencyRecord{State: idempotencyStateCompleted, Status: consts.StatusCreated, ContentType: "application/json", Body: []byte(`{"ok":true}`), Fingerprint: "fp-1"}
          if err := store.Complete(context.Background(), "key", record, time.Minute); err != nil {
              t.Fatal(err)
          }
          existing, acquired, err := store.Begin(context.Background(), "key", "fp-1", time.Minute)
          if err != nil || acquired || existing == nil || existing.State != idempotencyStateCompleted {
              t.Fatalf("second begin = (%+v, %v, %v), want completed replay", existing, acquired, err)
          }
      }

      func TestMemoryIdempotencyStoreDetectsFingerprintConflict(t *testing.T) {
          store := newMemoryIdempotencyStore(100)
          if _, acquired, err := store.Begin(context.Background(), "key", "fp-1", time.Minute); err != nil || !acquired {
              t.Fatalf("first begin acquired=%v err=%v", acquired, err)
          }
          existing, acquired, err := store.Begin(context.Background(), "key", "fp-2", time.Minute)
          if err != nil || acquired || existing == nil || existing.Fingerprint != "fp-1" {
              t.Fatalf("second begin = (%+v, %v, %v), want existing fp-1", existing, acquired, err)
          }
      }

      func TestMemoryIdempotencyStoreEvictsLRU(t *testing.T) {
          store := newMemoryIdempotencyStore(1)
          if _, acquired, err := store.Begin(context.Background(), "k1", "fp-1", time.Minute); err != nil || !acquired {
              t.Fatalf("begin k1 acquired=%v err=%v", acquired, err)
          }
          if _, acquired, err := store.Begin(context.Background(), "k2", "fp-2", time.Minute); err != nil || !acquired {
              t.Fatalf("begin k2 acquired=%v err=%v", acquired, err)
          }
          if _, acquired, err := store.Begin(context.Background(), "k1", "fp-1", time.Minute); err != nil || !acquired {
              t.Fatalf("begin evicted k1 acquired=%v err=%v; want fresh record after LRU eviction", acquired, err)
          }
      }

      func TestIdempotencyReplayResponse(t *testing.T) {
          c := app.NewContext(0)
          replayIdempotencyResponse(c, idempotencyRecord{State: idempotencyStateCompleted, Status: consts.StatusCreated, ContentType: "application/json", Body: []byte(`{"ok":true}`)})
          if c.Response.StatusCode() != consts.StatusCreated {
              t.Fatalf("status = %d, want %d", c.Response.StatusCode(), consts.StatusCreated)
          }
          if got := string(c.Response.Header.Peek(headerIdempotencyReplayed)); got != "true" {
              t.Fatalf("replayed header = %q", got)
          }
          if got := string(c.Response.Body()); got != `{"ok":true}` {
              t.Fatalf("body = %s", got)
          }
      }

      func TestIdempotencyKeyUsesVerifiedClaims(t *testing.T) {
          c := newIdempotencyContext("POST", "/orders")
          c.Request.Header.Set("X-App-Key", "raw-ak")
          c.Set(ContextKeyTokenClaims, &Claims{AK: "verified-ak", UUID: "user-1"})
          cfg := conf.IdempotencyConfig{KeyPrefix: "test", AppKeyHeader: "X-App-Key"}
          if got, want := idempotencyKey(c, cfg, "idem-1"), "test:ak_user_uuid_verified-ak_user-1:POST:/orders:idem-1"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestIdempotencyMissingKey(t *testing.T) {
          c := newIdempotencyContext("POST", "/orders")
          Idempotency(conf.IdempotencyConfig{Enabled: true, Backend: "memory", Header: "X-Idempotency-Key"})(context.Background(), c)
          if c.Response.StatusCode() != consts.StatusBadRequest {
              t.Fatalf("status = %d, want %d", c.Response.StatusCode(), consts.StatusBadRequest)
          }
          if got, want := string(c.Response.Body()), `{"code":10203,"msg":"idempotency_key_missing"}`; got != want {
              t.Fatalf("body = %s, want %s", got, want)
          }
      }

      func newIdempotencyContext(method, path string) *app.RequestContext {
          c := app.NewContext(0)
          req := protocol.NewRequest(method, path, nil)
          req.CopyTo(&c.Request)
          return c
      }

