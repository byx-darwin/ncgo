      func TestRateLimitRejectsAfterBurst(t *testing.T) {
          phase := conf.RateLimitPhaseConfig{Enabled: true, DefaultRule: conf.RateLimitRuleConfig{Enabled: true, KeyBy: []string{"ip"}, Strategy: "token_bucket", RequestsPerSecond: 1, Burst: 1, ClientTTLSeconds: config.Duration{Duration: 300 * time.Second}}}
          cfg := conf.RateLimitConfig{Enabled: true, Backend: "memory", KeyPrefix: "test", AppKeyHeader: "X-App-Key", PreAuth: phase}
          mw := RateLimit("pre_auth", cfg, phase, nil)

          first := newRateLimitContext("/ping")
          mw(context.Background(), first)
          if first.Response.StatusCode() == consts.StatusTooManyRequests {
              t.Fatalf("first request was rate limited")
          }

