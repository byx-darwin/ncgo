      func (c *Config) Validate() error {
          if c == nil {
              return oops.In("config").Code(10308).Public("config_invalid").New("config is nil")
          }
          if c.Server.Addr == "" {
              return oops.In("config").Code(10308).Public("config_invalid").New("server.addr is empty")
          }
          if c.Server.ReadTimeoutSeconds < 0 || c.Server.WriteTimeoutSeconds < 0 || c.Server.IdleTimeoutSeconds < 0 || c.Server.KeepAliveTimeoutSeconds < 0 || c.Server.RequestTimeoutSeconds < 0 {
              return oops.In("config").Code(10308).Public("config_invalid").New("server timeout seconds must not be negative")
          }
          if c.Swagger.Enabled {
              if !strings.HasPrefix(strings.TrimSpace(c.Swagger.Path), "/") {
                  return oops.In("config").Code(10308).Public("config_invalid").New("swagger.path must start with /")
              }
              if strings.TrimSpace(c.Swagger.SpecFile) == "" {
                  return oops.In("config").Code(10308).Public("config_invalid").New("swagger.spec_file is empty")
              }
          }
          if c.Auth.Signature.Enabled && c.Auth.Signature.StaticSecret == "" {
              return oops.In("config").Code(10308).Public("config_invalid").New("auth.signature.static_secret is empty")
          }
          if c.Auth.Signature.Enabled && c.Auth.Signature.Nonce.Enabled {
              switch c.Auth.Signature.Nonce.Backend {
              case "", "memory", "redis":
              default:
                  return oops.In("config").Code(10308).Public("config_invalid").New("auth.signature.nonce.backend must be memory or redis")
              }
              if c.Auth.Signature.Nonce.Backend == "redis" && len(c.Auth.Signature.Nonce.Redis.Addrs) == 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("auth.signature.nonce.redis.addrs is empty")
              }
              if c.Auth.Signature.Nonce.Backend == "memory" && c.Auth.Signature.Nonce.Memory.MaxEntries < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("auth.signature.nonce.memory.max_entries must not be negative")
              }
              if c.Auth.Signature.Nonce.TTLSeconds < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("auth.signature.nonce.ttl_seconds must not be negative")
              }
          }
          if c.Auth.Token.Enabled && c.Auth.Token.SigningKey == "" {
              return oops.In("config").Code(10308).Public("config_invalid").New("auth.token.signing_key is empty")
          }
          if c.CORS.Enabled && c.CORS.AllowCredentials && hasWildcard(c.CORS.AllowOrigins) {
              return oops.In("config").Code(10308).Public("config_invalid").New("cors.allow_credentials cannot be true when allow_origins contains *")
          }
          if c.RateLimit.Enabled {
              switch c.RateLimit.Backend {
              case "", "memory", "redis":
              default:
                  return oops.In("config").Code(10308).Public("config_invalid").New("rate_limit.backend must be memory or redis")
              }
              if c.RateLimit.Backend == "redis" && len(c.RateLimit.Redis.Addrs) == 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("rate_limit.redis.addrs is empty")
              }
              if c.RateLimit.Backend == "memory" && c.RateLimit.Memory.MaxEntries < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("rate_limit.memory.max_entries must not be negative")
              }
              if !c.RateLimit.PreAuth.Enabled && !c.RateLimit.PostAuth.Enabled {
                  return oops.In("config").Code(10308).Public("config_invalid").New("at least one rate_limit rule must be enabled")
              }
              if err := validateRateLimitRule("rate_limit.pre_auth", c.RateLimit.PreAuth); err != nil {
                  return err
              }
              if err := validateRateLimitRule("rate_limit.post_auth", c.RateLimit.PostAuth); err != nil {
                  return err
              }
          }
          if c.Idempotency.Enabled {
              switch c.Idempotency.Backend {
              case "", "memory", "redis":
              default:
                  return oops.In("config").Code(10308).Public("config_invalid").New("idempotency.backend must be memory or redis")
              }
              if c.Idempotency.Backend == "redis" && len(c.Idempotency.Redis.Addrs) == 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("idempotency.redis.addrs is empty")
              }
              if c.Idempotency.Backend == "memory" && c.Idempotency.Memory.MaxEntries < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("idempotency.memory.max_entries must not be negative")
              }
              if c.Idempotency.TTLSeconds < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("idempotency.ttl_seconds must not be negative")
              }
              if c.Idempotency.MaxBodyBytes < 0 {
                  return oops.In("config").Code(10308).Public("config_invalid").New("idempotency.max_body_bytes must not be negative")
              }
          }
          return nil
      }

      func validateRateLimitRule(name string, rule RateLimitRuleConfig) error {
          if !rule.Enabled {
              return nil
          }
          if rule.RequestsPerSecond <= 0 {
              return oops.In("config").Code(10308).Public("config_invalid").New(name + ".requests_per_second must be positive")
          }
          if rule.Burst <= 0 {
              return oops.In("config").Code(10308).Public("config_invalid").New(name + ".burst must be positive")
          }
          return nil
      }

      func hasWildcard(values []string) bool {
          for _, value := range values {
              if strings.TrimSpace(value) == "*" {
                  return true
              }
          }
          return false
      }

      func Env() string {
          if env := os.Getenv("GO_ENV"); env != "" {
              return env
          }
          return "dev"
      }

  # ── pkg/i18n: language negotiation and message catalog ───────────────────
  - path: internal/pkg/i18n/i18n.go
    delims: ["", ""]
    body: |-
      package i18n

      import (
          "sort"
          "strconv"
          "strings"
          "sync"
      )

      const (
          HeaderAcceptLanguage  = "Accept-Language"
          HeaderContentLanguage = "Content-Language"
          DefaultLanguage       = "en"
          SimplifiedChinese     = "zh-CN"
          TraditionalChinese    = "zh-TW"
          Japanese              = "ja-JP"
          Korean                = "ko-KR"
          French                = "fr-FR"
          German                = "de-DE"
          Spanish               = "es-ES"
      )

      var (
          catalogMu       sync.RWMutex
          catalog         = map[string]map[string]string{}
          languageAliases = map[string]string{}
      )

      func init() {
          RegisterLanguage(DefaultLanguage, "en")
          RegisterLanguage(SimplifiedChinese, "zh", "zh-CN", "zh-Hans")
          RegisterLanguage(TraditionalChinese, "zh-TW", "zh-Hant", "zh-HK", "zh-MO")
          RegisterLanguage(Japanese, "ja")
          RegisterLanguage(Korean, "ko")
          RegisterLanguage(French, "fr")
          RegisterLanguage(German, "de")
          RegisterLanguage(Spanish, "es")
      }

      func RegisterLanguage(language string, aliases ...string) string {
          language = strings.TrimSpace(language)
          if language == "" || language == "*" {
              panic("i18n: language must not be empty")
          }
          catalogMu.Lock()
          defer catalogMu.Unlock()
          if catalog[language] == nil {
              catalog[language] = map[string]string{}
          }
          registerLanguageAliasLocked(language, language)
          for _, alias := range aliases {
              registerLanguageAliasLocked(language, alias)
          }
          return language
      }

      func registerLanguageAliasLocked(language, alias string) {
          alias = languageKey(alias)
          if alias == "" || alias == "*" {
              return
          }
          languageAliases[alias] = language
      }

      func Register(language, key, message string) {
          if lang, ok := supportedLanguage(language); ok {
              language = lang
          } else {
              language = RegisterLanguage(language)
          }
          key, message = strings.TrimSpace(key), strings.TrimSpace(message)
          if key == "" || message == "" {
              panic("i18n: language key and message must not be empty")
          }
          catalogMu.Lock()
          defer catalogMu.Unlock()
          if catalog[language] == nil {
              catalog[language] = map[string]string{}
          }
          catalog[language][key] = message
      }

      func Translate(language, key string) string {
          language, key = Normalize(language), strings.TrimSpace(key)
          if key == "" || language == DefaultLanguage {
              return key
          }
          catalogMu.RLock()
          defer catalogMu.RUnlock()
          if messages := catalog[language]; messages != nil {
              if msg := messages[key]; msg != "" {
                  return msg
              }
          }
          return key
      }

      func FromAcceptLanguage(header string) string {
          candidates := parseAcceptLanguage(header)
          for _, candidate := range candidates {
              if lang, ok := supportedLanguage(candidate.Tag); ok {
                  return lang
              }
          }
          return DefaultLanguage
      }

      func Normalize(language string) string {
          if lang, ok := supportedLanguage(language); ok {
              return lang
          }
          return DefaultLanguage
      }

      func supportedLanguage(language string) (string, bool) {
          key := languageKey(language)
          if key == "" || key == "*" {
              return DefaultLanguage, true
          }
          catalogMu.RLock()
          defer catalogMu.RUnlock()
          for {
              if lang, ok := languageAliases[key]; ok {
                  return lang, true
              }
              i := strings.LastIndex(key, "-")
              if i <= 0 {
                  return "", false
              }
              key = key[:i]
          }
      }

      func languageKey(language string) string {
          return strings.ToLower(strings.ReplaceAll(strings.TrimSpace(language), "_", "-"))
      }

      type languageCandidate struct {
          Tag     string
          Quality float64
          Index   int
      }

      func parseAcceptLanguage(header string) []languageCandidate {
          parts := strings.Split(header, ",")
          candidates := make([]languageCandidate, 0, len(parts))
          for i, part := range parts {
              tag, quality := parseLanguagePart(part)
              if tag == "" || quality <= 0 {
                  continue
              }
              candidates = append(candidates, languageCandidate{Tag: tag, Quality: quality, Index: i})
          }
          sort.SliceStable(candidates, func(i, j int) bool {
              if candidates[i].Quality == candidates[j].Quality {
                  return candidates[i].Index < candidates[j].Index
              }
              return candidates[i].Quality > candidates[j].Quality
          })
          return candidates
      }

      func parseLanguagePart(part string) (string, float64) {
          segments := strings.Split(strings.TrimSpace(part), ";")
          tag := strings.TrimSpace(segments[0])
          quality := 1.0
          for _, segment := range segments[1:] {
              key, value, ok := strings.Cut(strings.TrimSpace(segment), "=")
              if ok && strings.TrimSpace(key) == "q" {
                  if parsed, err := strconv.ParseFloat(strings.TrimSpace(value), 64); err == nil {
                      quality = parsed
                  }
              }
          }
          return tag, quality
      }

  - path: internal/pkg/i18n/i18n_test.go
    delims: ["", ""]
    body: |-
      package i18n

      import "testing"

      func TestFromAcceptLanguageChoosesHighestQualitySupportedLanguage(t *testing.T) {
          got := FromAcceptLanguage("en-US;q=0.5, zh-CN;q=0.9")
          if got != SimplifiedChinese {
              t.Fatalf("language = %q, want %q", got, SimplifiedChinese)
          }
      }

      func TestFromAcceptLanguageSupportsBuiltInLanguages(t *testing.T) {
          cases := map[string]string{
              "zh-TW": TraditionalChinese,
              "ja-JP": Japanese,
              "ko-KR": Korean,
              "fr-FR": French,
              "de-DE": German,
              "es-ES": Spanish,
          }
          for header, want := range cases {
              if got := FromAcceptLanguage(header); got != want {
                  t.Fatalf("FromAcceptLanguage(%q) = %q, want %q", header, got, want)
              }
          }
      }

      func TestTranslateBuiltInLanguages(t *testing.T) {
          cases := map[string]string{
              "zh-TW": "介面不存在",
              "ja-JP": "インターフェースが存在しません",
              "ko-KR": "인터페이스가 존재하지 않습니다",
              "fr-FR": "interface introuvable",
              "de-DE": "Schnittstelle nicht gefunden",
              "es-ES": "interfaz no encontrada",
          }
          for lang, want := range cases {
              if got := Translate(lang, "route_not_found"); got != want {
                  t.Fatalf("Translate(%q, route_not_found) = %q, want %q", lang, got, want)
              }
          }
      }

      func TestTranslateFallsBackToKey(t *testing.T) {
          if got := Translate("zh-CN", "missing_key"); got != "missing_key" {
              t.Fatalf("translation = %q, want key fallback", got)
          }
      }

      func TestRegisterBusinessMessage(t *testing.T) {
          Register("zh-CN", "order_conflict", "订单冲突")
          if got := Translate("zh-CN", "order_conflict"); got != "订单冲突" {
              t.Fatalf("translation = %q", got)
          }
      }

      func TestRegisterLanguageSupportsDynamicLanguage(t *testing.T) {
          RegisterLanguage("it-IT", "it")
          Register("it-IT", "route_not_found", "interfaccia non trovata")
          if got := FromAcceptLanguage("it;q=0.9, en;q=0.8"); got != "it-IT" {
              t.Fatalf("dynamic language = %q, want it-IT", got)
          }
          if got := Translate("it-IT", "route_not_found"); got != "interfaccia non trovata" {
              t.Fatalf("dynamic translation = %q", got)
          }
      }

