      type Body struct {
          Status string `json:"status"`
          Time   string `json:"time"`
      }

      func Register(h *server.Hertz) {
          h.GET("/healthz", Healthz)
          h.GET("/readyz", Readyz)
      }

      func Healthz(ctx context.Context, c *app.RequestContext) {
          _ = ctx
          response.OK(c, Body{Status: "ok", Time: time.Now().UTC().Format(time.RFC3339)})
      }

      func Readyz(ctx context.Context, c *app.RequestContext) {
          _ = ctx
          response.OK(c, Body{Status: "ready", Time: time.Now().UTC().Format(time.RFC3339)})
      }

  # ── pkg/response tests ────────────────────────────────────────────────────
  - path: internal/pkg/response/response_test.go
    delims: ["", ""]
    body: |-
      package response

      import (
          "testing"

          "github.com/cloudwego/hertz/pkg/app"
          "github.com/cloudwego/hertz/pkg/protocol"
          "github.com/cloudwego/hertz/pkg/protocol/consts"
          "github.com/samber/oops"
      )

      func TestScaffoldDefinitionMapping(t *testing.T) {
          cases := []struct {
              code   int
              msg    string
              status int
          }{
              {CodeRequestBindFailed, "request_bind_failed", consts.StatusBadRequest},
              {CodeSignatureInvalid, "signature_invalid", consts.StatusForbidden},
              {CodeTokenExpired, "token_expired", consts.StatusUnauthorized},
              {CodeRateLimited, "rate_limited", consts.StatusTooManyRequests},
              {CodeRPCFailed, "rpc_failed", consts.StatusBadGateway},
              {CodeRPCTimeout, "rpc_timeout", consts.StatusGatewayTimeout},
              {CodeNotImplemented, "not_implemented", consts.StatusNotImplemented},
              {CodeRequestTimeout, "request_timeout", consts.StatusGatewayTimeout},
          }
          for _, tt := range cases {
              if got := MsgFromCode(tt.code); got != tt.msg {
                  t.Fatalf("MsgFromCode(%d) = %q, want %q", tt.code, got, tt.msg)
              }
              if got := StatusFromCode(tt.code); got != tt.status {
                  t.Fatalf("StatusFromCode(%d) = %d, want %d", tt.code, got, tt.status)
              }
          }
      }

      func TestBusinessDefinitionMapping(t *testing.T) {
          def := MustRegister(Definition{Code: 39999, Msg: "business_test_error", Status: consts.StatusConflict})
          if got := MsgFromCode(def.Code); got != def.Msg {
              t.Fatalf("MsgFromCode(%d) = %q, want %q", def.Code, got, def.Msg)
          }
          if got := StatusFromCode(def.Code); got != def.Status {
              t.Fatalf("StatusFromCode(%d) = %d, want %d", def.Code, got, def.Status)
          }
          code, msg := CodeMsg(oops.Code(def.Code).Public("ignored_public").New("business error"))
          if code != def.Code || msg != def.Msg {
              t.Fatalf("CodeMsg = (%d, %q), want (%d, %q)", code, msg, def.Code, def.Msg)
          }
      }

      func TestErrorCodeLocalizesMessageFromAcceptLanguage(t *testing.T) {
          c := app.NewContext(0)
          req := protocol.NewRequest("GET", "/missing", nil)
          req.Header.Set("Accept-Language", "zh-CN,zh;q=0.9,en;q=0.8")
          req.CopyTo(&c.Request)

          ErrorCode(c, CodeRouteNotFound)

          if got, want := string(c.Response.Body()), `{"code":10008,"msg":"接口不存在"}`; got != want {
              t.Fatalf("body = %s, want %s", got, want)
          }
          if got := string(c.Response.Header.Peek("Content-Language")); got != "zh-CN" {
              t.Fatalf("Content-Language = %q, want zh-CN", got)
          }
      }

  # ── base/data ────────────────────────────────────────────────────────────
  - path: internal/base/data/data.go
    delims: ["{{", "}}"]
    body: |-
      package data

      {{ if .WithDatabase}}
      import (
          "context"

          "github.com/jackc/pgx/v5/pgxpool"
          "github.com/samber/oops"

          "{{.GoModule}}/internal/db/gen"
      )

      // Data holds shared infrastructure clients.
      // Add optional clients (Redis / Kafka / ES / ClickHouse) by copying files
      // from this skill's assets/optional/ directory into this package.
      type Data struct {
          Pool    *pgxpool.Pool // native pgx pool — supports Batch, CopyFrom, LISTEN/NOTIFY
          Queries *gen.Queries  // sqlc-generated query methods
      }

      // New initialises core infrastructure connections.
      // Wire up via samber/do in internal/base/server/server.go.
      func New(pool *pgxpool.Pool) (*Data, func(), error) {
          queries := gen.New(pool)
          cleanup := func() {
              pool.Close()
          }
          return &Data{Pool: pool, Queries: queries}, cleanup, nil
      }

      // NewPostgres opens and validates a PostgreSQL connection pool via native pgx/v5.
      // Pass the full *pgxpool.Config via samber/do so every pool option is available.
      func NewPostgres(ctx context.Context, cfg *pgxpool.Config) (*pgxpool.Pool, error) {
          if cfg == nil {
              return nil, oops.
                  In("postgres").
                  Tags("database", "postgres", "connection").
                  Code(10308).
                  Public("config_invalid").
                  New("pgxpool.Config is nil")
          }
          pool, err := pgxpool.NewWithConfig(ctx, cfg)
          if err != nil {
              return nil, oops.
                  In("postgres").
                  Tags("database", "postgres", "connection").
                  Code(10303).
                  Public("database_unavailable").
                  With("max_conns", cfg.MaxConns).
                  With("min_conns", cfg.MinConns).
                  Wrapf(err, "pgxpool.NewWithConfig")
          }
          if err := pool.Ping(ctx); err != nil {
              pool.Close()
              return nil, oops.
                  In("postgres").
                  Tags("database", "postgres", "connection").
                  Code(10303).
                  Public("database_unavailable").
                  With("max_conns", cfg.MaxConns).
                  With("min_conns", cfg.MinConns).
                  Wrapf(err, "pool.Ping")
          }
          return pool, nil
      }

      // NewPostgresConfig parses a DSN into pgxpool.Config.
      // Mutate the returned config in conf/server wiring to set MaxConns, MinConns,
      // MaxConnLifetime, MaxConnIdleTime, HealthCheckPeriod, ConnConfig, hooks, etc.
      func NewPostgresConfig(dsn string) (*pgxpool.Config, error) {
          if dsn == "" {
              return nil, oops.
                  In("postgres").
                  Tags("database", "postgres", "configuration").
                  Code(10308).
                  Public("config_invalid").
                  New("postgres DSN is empty")
          }
          cfg, err := pgxpool.ParseConfig(dsn)
          if err != nil {
              return nil, oops.
                  In("postgres").
                  Tags("database", "postgres", "configuration").
                  Code(10308).
                  Public("config_invalid").
                  Wrapf(err, "pgxpool.ParseConfig")
          }
          return cfg, nil
      }
      {{ else}}
      // Data is intentionally empty for pure BFF services.
      // Use adapters for downstream RPC calls; copy optional add-ons only when needed.
      type Data struct{}

      // New initialises shared infrastructure for BFF-only services.
      func New() (*Data, func(), error) {
          return &Data{}, func() {}, nil
      }
      {{ end}}

  - path: internal/base/data/tx.go
    delims: ["{{", "}}"]
    body: |-
      package data

      {{ if .WithDatabase}}
      import (
          "context"

          "github.com/jackc/pgx/v5"
          "github.com/jackc/pgx/v5/pgxpool"
          "github.com/samber/oops"

          "{{.GoModule}}/internal/db/gen"
      )

      type TxFunc func(ctx context.Context, q *gen.Queries) error

      // WithTx runs fn in a database transaction using default pgx transaction options.
      func WithTx(ctx context.Context, pool *pgxpool.Pool, fn TxFunc) error {
          return WithTxOptions(ctx, pool, pgx.TxOptions{}, fn)
      }

      // WithTxOptions runs fn in a database transaction and commits only when fn succeeds.
      // Rollback is attempted for fn errors and panics; panics are re-thrown after rollback.
      func WithTxOptions(ctx context.Context, pool *pgxpool.Pool, opts pgx.TxOptions, fn TxFunc) (err error) {
          if pool == nil {
              return txConfigError("pgxpool.Pool is nil")
          }
          if fn == nil {
              return txConfigError("transaction callback is nil")
          }
          tx, err := pool.BeginTx(ctx, opts)
          if err != nil {
              return txDatabaseError(err, "begin transaction")
          }
          committed := false
          defer func() {
              if recovered := recover(); recovered != nil {
                  _ = tx.Rollback(ctx)
                  panic(recovered)
              }
              if !committed {
                  _ = tx.Rollback(ctx)
              }
          }()

          q := gen.New(tx)
          if err := fn(ctx, q); err != nil {
              return err
          }
          if err := tx.Commit(ctx); err != nil {
              return txDatabaseError(err, "commit transaction")
          }
          committed = true
          return nil
      }

      // WithTx runs fn in a transaction using the Data pool.
      func (d *Data) WithTx(ctx context.Context, fn TxFunc) error {
          if d == nil {
              return txConfigError("data is nil")
          }
          return WithTx(ctx, d.Pool, fn)
      }

      // WithTxOptions runs fn in a transaction using the Data pool and explicit pgx options.
      func (d *Data) WithTxOptions(ctx context.Context, opts pgx.TxOptions, fn TxFunc) error {
          if d == nil {
              return txConfigError("data is nil")
          }
          return WithTxOptions(ctx, d.Pool, opts, fn)
      }

      func txConfigError(message string) error {
          return oops.In("postgres.tx").Tags("database", "postgres", "transaction").Code(10308).Public("config_invalid").New(message)
      }

      func txDatabaseError(err error, operation string) error {
          return oops.In("postgres.tx").Tags("database", "postgres", "transaction").Code(10303).Public("database_unavailable").With("operation", operation).Wrapf(err, "database transaction failed")
      }
      {{ else}}
      // Transaction helpers are generated only when WithDatabase=true.
      {{ end}}

  - path: internal/base/data/tx_test.go
    delims: ["{{", "}}"]
    body: |-
      package data

      {{ if .WithDatabase}}
      import (
          "context"
          "testing"

          "github.com/samber/oops"
      )

      func TestWithTxRejectsNilPool(t *testing.T) {
          err := WithTx(context.Background(), nil, nil)
          if err == nil {
              t.Fatal("expected error")
          }
          if oe, ok := oops.AsOops(err); !ok || oe.Code() != 10308 {
              t.Fatalf("error = %+v, want oops code 10308", err)
          }
      }

      func TestDataWithTxRejectsNilData(t *testing.T) {
          var d *Data
          err := d.WithTx(context.Background(), nil)
          if err == nil {
              t.Fatal("expected error")
          }
          if oe, ok := oops.AsOops(err); !ok || oe.Code() != 10308 {
              t.Fatalf("error = %+v, want oops code 10308", err)
          }
      }
      {{ end}}

