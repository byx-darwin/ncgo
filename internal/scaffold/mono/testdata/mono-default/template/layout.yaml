  # ── pkg/middleware: rate limit ─────────────────────────────────────────────
  - path: internal/pkg/middleware/rate_limit.go
    delims: ["{{", "}}"]
    body: |-
      package middleware

      import (
          "context"
          "net"
          "sync"
          "time"
          "strings"

          "github.com/cloudwego/hertz/pkg/app"
          "github.com/redis/go-redis/v9"
              "github.com/samber/hot"

          "{{.GoModule}}/internal/base/conf"
          "{{.GoModule}}/internal/pkg/response"
      )

      type rateLimitStore interface {
          Allow(ctx context.Context, key string, rate float64, burst int, ttl time.Duration) (bool, error)
      }

      type rateBucket struct {
          tokens float64
          last   time.Time
      }

      type memoryRateLimitStore struct {
              mu      sync.Mutex
              buckets *hot.HotCache[string, *rateBucket]
      }

      func RateLimit(cfg conf.RateLimitConfig, rule conf.RateLimitRuleConfig) app.HandlerFunc {
          cfg = normalizeRateLimitConfig(cfg)
          rule = normalizeRateLimitRule(rule)
          skipper := PathSkipper(cfg.SkipPaths...)
          store := newRateLimitStore(cfg)
          ttl := time.Duration(rule.ClientTTLSeconds) * time.Second
          return func(ctx context.Context, c *app.RequestContext) {
              if !cfg.Enabled || !rule.Enabled || skipper(ctx, c) {
                  c.Next(ctx)
                  return
              }
              key := rateLimitKey(c, cfg, rule.KeyBy)
              ok, err := store.Allow(ctx, key, rule.RequestsPerSecond, rule.Burst, ttl)
              if err != nil {
                  if cfg.FailOpen {
                      c.Next(ctx)
                      return
                  }
                  response.ErrorCode(c, response.CodeCacheUnavailable)
                  c.Abort()
                  return
              }
              if !ok {
                  response.ErrorCode(c, response.CodeRateLimited)
                  c.Abort()
                  return
              }
              c.Next(ctx)
          }
      }

      func newRateLimitStore(cfg conf.RateLimitConfig) rateLimitStore {
          if cfg.Backend == "redis" {
              return &redisRateLimitStore{client: redis.NewUniversalClient(redisUniversalOptions(cfg.Redis))}
          }
              return newMemoryRateLimitStore(cfg.Memory.MaxEntries)
      }

          func newMemoryRateLimitStore(maxEntries int) *memoryRateLimitStore {
              return &memoryRateLimitStore{buckets: hot.NewHotCache[string, *rateBucket](hot.LRU, memoryCacheMaxEntries(maxEntries)).Build()}
          }

      func redisUniversalOptions(cfg conf.RateLimitRedisConfig) *redis.UniversalOptions {
          return &redis.UniversalOptions{
              Addrs:                 cfg.Addrs,
              ClientName:            cfg.ClientName,
              DB:                    cfg.DB,
              Protocol:              cfg.Protocol,
              Username:              cfg.Username,
              Password:              cfg.Password,
              SentinelUsername:      cfg.SentinelUsername,
              SentinelPassword:      cfg.SentinelPassword,
              MaxRetries:            cfg.MaxRetries,
              MinRetryBackoff:       durationMilliseconds(cfg.MinRetryBackoffMilliseconds),
              MaxRetryBackoff:       durationMilliseconds(cfg.MaxRetryBackoffMilliseconds),
              DialTimeout:           durationSeconds(cfg.DialTimeoutSeconds),
              DialerRetries:         cfg.DialerRetries,
              DialerRetryTimeout:    durationMilliseconds(cfg.DialerRetryTimeoutMilliseconds),
              ReadTimeout:           durationSeconds(cfg.ReadTimeoutSeconds),
              WriteTimeout:          durationSeconds(cfg.WriteTimeoutSeconds),
              ContextTimeoutEnabled: cfg.ContextTimeoutEnabled,
              ReadBufferSize:        cfg.ReadBufferSize,
              WriteBufferSize:       cfg.WriteBufferSize,
              PoolFIFO:              cfg.PoolFIFO,
              PoolSize:              cfg.PoolSize,
              MaxConcurrentDials:    cfg.MaxConcurrentDials,
              PoolTimeout:           durationSeconds(cfg.PoolTimeoutSeconds),
              MinIdleConns:          cfg.MinIdleConns,
              MaxIdleConns:          cfg.MaxIdleConns,
              MaxActiveConns:        cfg.MaxActiveConns,
              ConnMaxIdleTime:       durationSeconds(cfg.ConnMaxIdleTimeSeconds),
              ConnMaxLifetime:       durationSeconds(cfg.ConnMaxLifetimeSeconds),
              ConnMaxLifetimeJitter: durationSeconds(cfg.ConnMaxLifetimeJitterSeconds),
              MaxRedirects:          cfg.MaxRedirects,
              ReadOnly:              cfg.ReadOnly,
              RouteByLatency:        cfg.RouteByLatency,
              RouteRandomly:         cfg.RouteRandomly,
              MasterName:            cfg.MasterName,
              DisableIdentity:       cfg.DisableIdentity,
              IdentitySuffix:        cfg.IdentitySuffix,
              UnstableResp3:         cfg.UnstableResp3,
              FailingTimeoutSeconds: cfg.FailingTimeoutSeconds,
          }
      }

      func durationSeconds(value int) time.Duration {
          if value <= 0 {
              return 0
          }
          return time.Duration(value) * time.Second
      }

      func durationMilliseconds(value int) time.Duration {
          if value <= 0 {
              return 0
          }
          return time.Duration(value) * time.Millisecond
      }

      func (s *memoryRateLimitStore) Allow(ctx context.Context, key string, rate float64, burst int, ttl time.Duration) (bool, error) {
          _ = ctx
              if ttl <= 0 {
                  ttl = 300 * time.Second
              }
          now := time.Now()
          burstFloat := float64(burst)
          s.mu.Lock()
          defer s.mu.Unlock()
              bucket, found, err := s.buckets.Get(key)
              if err != nil {
                  return false, err
              }
              if !found || bucket == nil {
              bucket = &rateBucket{tokens: burstFloat, last: now}
          }
          elapsed := now.Sub(bucket.last).Seconds()
          bucket.tokens += elapsed * rate
          if bucket.tokens > burstFloat {
              bucket.tokens = burstFloat
          }
          bucket.last = now
          if bucket.tokens < 1 {
                  s.buckets.SetWithTTL(key, bucket, ttl)
              return false, nil
          }
          bucket.tokens--
              s.buckets.SetWithTTL(key, bucket, ttl)
          return true, nil
      }

      type redisRateLimitStore struct {
          client redis.UniversalClient
      }

      var redisRateLimitScript = redis.NewScript(`
      local key = KEYS[1]
      local now = tonumber(ARGV[1])
      local rate = tonumber(ARGV[2])
      local burst = tonumber(ARGV[3])
      local ttl = tonumber(ARGV[4])
      local values = redis.call("HMGET", key, "tokens", "ts")
      local tokens = tonumber(values[1]) or burst
      local ts = tonumber(values[2]) or now
      local elapsed = math.max(0, now - ts) / 1000
      tokens = math.min(burst, tokens + elapsed * rate)
      local allowed = 0
      if tokens >= 1 then
          tokens = tokens - 1
          allowed = 1
      end
      redis.call("HMSET", key, "tokens", tokens, "ts", now)
      redis.call("EXPIRE", key, ttl)
      return allowed
      `)

      func (s *redisRateLimitStore) Allow(ctx context.Context, key string, rate float64, burst int, ttl time.Duration) (bool, error) {
          ttlSeconds := int(ttl.Seconds())
          if ttlSeconds <= 0 {
              ttlSeconds = 300
          }
          allowed, err := redisRateLimitScript.Run(ctx, s.client, []string{key}, time.Now().UnixMilli(), rate, burst, ttlSeconds).Int()
          if err != nil {
              return false, err
          }
          return allowed == 1, nil
      }

      func rateLimitKey(c *app.RequestContext, cfg conf.RateLimitConfig, keyBy []string) string {
          claims, hasClaims := GetClaims(c)
          for _, part := range keyBy {
              switch strings.TrimSpace(part) {
              case "ak_user_uuid":
                  if hasClaims && claims.AK != "" && claims.UUID != "" {
                      return joinRateLimitKey(cfg.KeyPrefix, "ak_user_uuid", claims.AK, claims.UUID)
                  }
              case "user_uuid":
                  if hasClaims && claims.UUID != "" {
                      return joinRateLimitKey(cfg.KeyPrefix, "user_uuid", claims.UUID)
                  }
              case "ak":
                  if hasClaims && claims.AK != "" {
                      return joinRateLimitKey(cfg.KeyPrefix, "ak", claims.AK)
                  }
                  if ak := strings.TrimSpace(c.Request.Header.Get(cfg.AppKeyHeader)); ak != "" {
                      return joinRateLimitKey(cfg.KeyPrefix, "ak", ak)
                  }
              case "ip":
                  if ip := requestIP(c); ip != "" {
                      return joinRateLimitKey(cfg.KeyPrefix, "ip", ip)
                  }
              }
          }
          return joinRateLimitKey(cfg.KeyPrefix, "ip", requestIP(c))
      }

      func requestIP(c *app.RequestContext) string {
          if ip := remoteIP(c); ip != nil {
              return ip.String()
          }
          if ip := net.ParseIP(c.ClientIP()); ip != nil {
              return ip.String()
          }
          return "unknown"
      }

      func joinRateLimitKey(parts ...string) string {
          safe := make([]string, 0, len(parts))
          for _, part := range parts {
              part = strings.TrimSpace(part)
              if part == "" {
                  continue
              }
              safe = append(safe, strings.NewReplacer(":", "_", " ", "_", "\n", "_").Replace(part))
          }
          return strings.Join(safe, ":")
      }

      func normalizeRateLimitConfig(cfg conf.RateLimitConfig) conf.RateLimitConfig {
          if cfg.Backend == "" {
              cfg.Backend = "memory"
          }
          if cfg.KeyPrefix == "" {
              cfg.KeyPrefix = "rate_limit"
          }
          if cfg.AppKeyHeader == "" {
              cfg.AppKeyHeader = "X-App-Key"
          }
              if cfg.Memory.MaxEntries <= 0 {
                  cfg.Memory.MaxEntries = defaultMemoryCacheMaxEntries
              }
          return cfg
      }

      func normalizeRateLimitRule(rule conf.RateLimitRuleConfig) conf.RateLimitRuleConfig {
          if len(rule.KeyBy) == 0 {
              rule.KeyBy = []string{"ip"}
          }
          if rule.RequestsPerSecond <= 0 {
              rule.RequestsPerSecond = 100
          }
          if rule.Burst <= 0 {
              rule.Burst = 200
          }
          if rule.ClientTTLSeconds <= 0 {
              rule.ClientTTLSeconds = 300
          }
          return rule
      }

