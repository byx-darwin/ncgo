  # ── Makefile ─────────────────────────────────────────────────────────────
  - path: Makefile
    delims: ["{{", "}}"]
    body: |
      APP_NAME = {{.ServiceName}}
      MODULE   = {{.GoModule}}
      GOOSE_DRIVER ?= postgres
      GOOSE_DBSTRING ?= $(DATABASE_URL)
      GOOSE_MIGRATION_DIR ?= internal/db/migrations

      .PHONY: build run dev i18n-sync i18n-report i18n-check i18n-check-release i18n update swagger generate sqlc migrate-create migrate-up migrate-down migrate-status lint test check tidy clean install-tools

      # ── Build ──────────────────────────────────────────────────────────────
      build: ; @echo "Building $(APP_NAME)..."; mkdir -p output/bin; go build -o output/bin/$(APP_NAME) .; echo "Build complete → output/bin/$(APP_NAME)"

      run: build ; @./output/bin/$(APP_NAME)

      dev: ; @which air > /dev/null 2>&1 && air || go run .

      # ── Code generation ────────────────────────────────────────────────────
      i18n-sync: ; @echo "Synchronizing i18n locales..."; go run ./tools/i18n/sync -root . -locales internal/pkg/i18n/locales -status internal/pkg/i18n/.meta/status.json -source zh-CN && echo "i18n sync complete → internal/pkg/i18n/.meta/status.json"

      i18n-report: ; @echo "Writing i18n report..."; go run ./tools/i18n/report -locales internal/pkg/i18n/locales -status internal/pkg/i18n/.meta/status.json -glossary internal/pkg/i18n/glossary.json -source zh-CN -out-md internal/pkg/i18n/.meta/report.md -out-json internal/pkg/i18n/.meta/report.json && echo "i18n report complete → internal/pkg/i18n/.meta/report.md"

      i18n-check: ; @echo "Checking i18n locales..."; go run ./tools/i18n/check -locales internal/pkg/i18n/locales -status internal/pkg/i18n/.meta/status.json -glossary internal/pkg/i18n/glossary.json -source zh-CN -mode dev && echo "i18n check complete"

      i18n-check-release: ; @echo "Checking i18n locales (release mode)..."; go run ./tools/i18n/check -locales internal/pkg/i18n/locales -status internal/pkg/i18n/.meta/status.json -glossary internal/pkg/i18n/glossary.json -source zh-CN -mode release && echo "i18n release check complete"

      # Generate internal/pkg/i18n/catalog_gen.go from internal/pkg/i18n/locales/*.json.
      i18n: ; @echo "Generating i18n catalog..."; go run ./tools/i18n/gen -in internal/pkg/i18n/locales -out internal/pkg/i18n/catalog_gen.go; echo "i18n catalog complete → internal/pkg/i18n/catalog_gen.go"

      # Re-run after modifying any .proto IDL file.
      # router_dir is persisted in .hz from the initial hz new command.
      update: ; @echo "Generating Hertz code from IDL..."; hz update --idl=idl/app/{{.ServiceName}}.proto -I idl --handler_dir=internal/handler --model_dir=internal/pb --customize_package=template/package.yaml; echo "Code generation complete"

      swagger: ; @command -v protoc >/dev/null 2>&1 || (echo "protoc is required for make swagger"; echo "install (macOS): brew install protobuf"; exit 1); command -v protoc-gen-http-swagger >/dev/null 2>&1 || (echo "protoc-gen-http-swagger is required for make swagger"; echo "install: go install github.com/hertz-contrib/swagger-generate/protoc-gen-http-swagger@latest"; echo "ensure GOBIN or $$(go env GOPATH)/bin is on PATH"; echo "or run: make install-tools"; exit 1); echo "Generating Swagger docs from IDL..."; mkdir -p internal/docs/swagger; protoc --http-swagger_out=internal/docs/swagger -I idl idl/app/{{.ServiceName}}.proto && rm -f internal/docs/swagger/swagger.go && echo "Swagger generation complete → internal/docs/swagger (rebuild/restart to embed updated spec)"

      sqlc: ; @echo "Generating sqlc code..."; sqlc generate -f internal/db/sqlc.yaml

      migrate-create: ; @test -n "$(name)" || (echo "usage: make migrate-create name=create_users" && exit 1); goose -dir $(GOOSE_MIGRATION_DIR) create $(name) sql

      migrate-up: ; @test -n "$(GOOSE_DBSTRING)" || (echo "DATABASE_URL is required" && exit 1); goose -dir $(GOOSE_MIGRATION_DIR) $(GOOSE_DRIVER) "$(GOOSE_DBSTRING)" up

      migrate-down: ; @test -n "$(GOOSE_DBSTRING)" || (echo "DATABASE_URL is required" && exit 1); goose -dir $(GOOSE_MIGRATION_DIR) $(GOOSE_DRIVER) "$(GOOSE_DBSTRING)" down

      migrate-status: ; @test -n "$(GOOSE_DBSTRING)" || (echo "DATABASE_URL is required" && exit 1); goose -dir $(GOOSE_MIGRATION_DIR) $(GOOSE_DRIVER) "$(GOOSE_DBSTRING)" status

      generate: i18n-sync i18n-check i18n update swagger sqlc ; @echo "All code generation complete"

      # ── Quality ────────────────────────────────────────────────────────────
      lint: ; @golangci-lint run ./...

      test: ; @go test -race -count=1 ./...

      check: lint test

      # ── Dependencies ───────────────────────────────────────────────────────
      tidy: ; @go mod tidy

      # ── Install tools ──────────────────────────────────────────────────────
      install-tools: ; @echo "Installing development tools..."; go install github.com/cloudwego/hertz/cmd/hz@latest; go install github.com/hertz-contrib/swagger-generate/protoc-gen-http-swagger@latest; go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest; go install github.com/pressly/goose/v3/cmd/goose@latest; go install github.com/air-verse/air@latest; go install golang.org/x/tools/cmd/goimports@latest; command -v protoc > /dev/null 2>&1 || echo "Warning: protoc is required for make swagger"; echo "Install complete"

      # ── Cleanup ────────────────────────────────────────────────────────────
      clean: ; @rm -rf output/
