  # ── base/server ──────────────────────────────────────────────────────────
  - path: internal/base/server/server.go
    delims: ["{{", "}}"]
    body: |-
      package server

      import (
          "context"
          "strings"
          "time"

          "github.com/cloudwego/hertz/pkg/app"
          "github.com/cloudwego/hertz/pkg/app/server"
          "github.com/cloudwego/hertz/pkg/protocol/consts"
          swaggerui "github.com/hertz-contrib/swagger"
          swaggerFiles "github.com/swaggo/files"
          "github.com/samber/do/v2"

          "{{.GoModule}}/internal/base/conf"
          "{{.GoModule}}/internal/docs"
          "{{.GoModule}}/internal/handler/health"
          "{{.GoModule}}/internal/pkg/middleware"
          "{{.GoModule}}/internal/router"
      )

      // Run starts the Hertz HTTP server.
      // Wire infrastructure, repositories, adapters, usecases, and handlers here.
      func Run() {
          injector := do.New()
          defer func() { _ = injector.Shutdown() }()

          // TODO: register providers with samber/do.
          // For DB-backed services, build a full *pgxpool.Config first, then:
          // startupCtx, cancel := context.WithTimeout(context.Background(), 10 * time.Second)
          // defer cancel()
          // do.ProvideValue[context.Context](injector, startupCtx)
          // do.ProvideValue(injector, pgCfg)
          // do.Provide(injector, data.NewPostgres)
          // do.Provide(injector, data.New)
          // do.Provide(injector, repository.NewUserRepo)
          // do.Provide(injector, adapter.NewDeviceAdapter)
          // do.Provide(injector, usecase.NewUserUseCase)
          // do.Provide(injector, handler.NewUserHandler)

          cfg := conf.Get()
          if cfg == nil {
              cfg = conf.Default()
          }
          do.ProvideValue(injector, cfg)
          // ncgo:wire:logging:init

          h := server.Default(
              server.WithHostPorts(cfg.Server.Addr),
              server.WithHandleMethodNotAllowed(true),
              server.WithReadTimeout(serverDurationSeconds(cfg.Server.ReadTimeoutSeconds)),
              server.WithWriteTimeout(serverDurationSeconds(cfg.Server.WriteTimeoutSeconds)),
              server.WithIdleTimeout(serverDurationSeconds(cfg.Server.IdleTimeoutSeconds)),
              server.WithKeepAliveTimeout(serverDurationSeconds(cfg.Server.KeepAliveTimeoutSeconds)),
          )
          // Optional structured logging wiring (after `ncgo add infra logging`):
          // import "{{.GoModule}}/internal/base/logging"
          // Initialize logging before registering middleware, then replace the
          // default Recovery/RequestID/AccessLog middleware below with:
          // h.Use(logging.HertzRecovery())
          // h.Use(logging.HertzRequestID())
          // h.Use(logging.HertzAccessLog())
          // ncgo:wire:logging:server-middleware
          h.Use(middleware.Recovery())
          h.Use(middleware.RequestID())
          // Optional release canary wiring (after `ncgo add infra canary`):
          // import "{{.GoModule}}/internal/base/release"
          // h.Use(release.HertzTraffic()) // reads X-Traffic-Lane/X-User-ID/X-Tenant-ID
          // ncgo:wire:canary:server-traffic
          h.Use(middleware.AccessLog())
          h.Use(middleware.RequestTimeout(serverDurationSeconds(cfg.Server.RequestTimeoutSeconds)))
          h.Use(middleware.InternalOnly(cfg.Security.InternalPaths, cfg.Security.InternalCIDRs))
          if cfg.CORS.Enabled {
              h.Use(middleware.CORS(cfg.CORS))
          }
          if cfg.RateLimit.Enabled && cfg.RateLimit.PreAuth.Enabled {
              h.Use(middleware.RateLimit(cfg.RateLimit, cfg.RateLimit.PreAuth))
          }
          h.NoRoute(middleware.NoRoute)
          h.NoMethod(middleware.NoMethod)

          authSkipper := middleware.PathSkipper(cfg.Auth.PublicPaths...)

          if cfg.Auth.Signature.Enabled {
              h.Use(middleware.Unless(middleware.SignatureAuth(
                  cfg.Auth.Signature,
                  middleware.StaticSecretResolver{SecretValue: cfg.Auth.Signature.StaticSecret},
              ), authSkipper))
          }
          if cfg.Auth.Token.Enabled {
              h.Use(middleware.Unless(middleware.JWTAuth(cfg.Auth.Token), authSkipper))
          }
          if cfg.RateLimit.Enabled && cfg.RateLimit.PostAuth.Enabled {
              h.Use(middleware.RateLimit(cfg.RateLimit, cfg.RateLimit.PostAuth))
          }
          if cfg.Idempotency.Enabled {
              h.Use(middleware.Idempotency(cfg.Idempotency))
          }

          health.Register(h)
          if cfg.Swagger.Enabled {
              registerSwaggerRoutes(h, cfg.Swagger)
          }

          // Register routes generated by hz from the IDL annotations.
          router.GeneratedRegister(h)

          h.Spin()
      }

      func serverDurationSeconds(value int) time.Duration {
          if value <= 0 {
              return 0
          }
          return time.Duration(value) * time.Second
      }

      func registerSwaggerRoutes(h *server.Hertz, cfg conf.SwaggerConfig) {
          basePath := normalizeSwaggerPath(cfg.Path)
          specRoute := basePath + "/openapi.yaml"

          h.GET(basePath+"/*any", swaggerui.WrapHandler(
              swaggerFiles.Handler,
              swaggerui.URL(specRoute),
          ))
          h.GET(specRoute, func(ctx context.Context, c *app.RequestContext) {
              body := docs.OpenAPIYAML()
              if len(body) == 0 {
                  c.String(consts.StatusServiceUnavailable, "swagger spec not embedded; run `make swagger` and rebuild")
                  return
              }
              c.Header("Content-Type", "application/x-yaml")
              _, _ = c.Write(body)
          })
      }

      func normalizeSwaggerPath(value string) string {
          value = strings.TrimSpace(value)
          if value == "" || value == "/" {
              return "/swagger"
          }
          return "/" + strings.Trim(value, "/")
      }

