    delims: ["", ""]
    body: |-
      package main

      import (
          "bytes"
          "encoding/json"
          "flag"
          "fmt"
          "go/format"
          "os"
          "path/filepath"
          "sort"
          "strconv"
          "strings"
      )

      type localeFile struct {
          Language string            `json:"language"`
          Aliases  []string          `json:"aliases"`
          Messages map[string]string `json:"messages"`
      }

      func main() {
          in := flag.String("in", "internal/pkg/i18n/locales", "directory containing locale JSON files")
          out := flag.String("out", "internal/pkg/i18n/catalog_gen.go", "generated Go output path")
          flag.Parse()
          locales, err := loadLocales(*in)
          if err != nil {
              fatal(err)
          }
          src, err := render(locales)
          if err != nil {
              fatal(err)
          }
          if err := os.MkdirAll(filepath.Dir(*out), 0o755); err != nil {
              fatal(err)
          }
          if err := os.WriteFile(*out, src, 0o644); err != nil {
              fatal(err)
          }
      }

      func loadLocales(dir string) ([]localeFile, error) {
          var locales []localeFile
          err := filepath.WalkDir(dir, func(path string, d os.DirEntry, err error) error {
              if err != nil || d.IsDir() || !strings.HasSuffix(d.Name(), ".json") {
                  return err
              }
              body, err := os.ReadFile(path)
              if err != nil {
                  return err
              }
              var loc localeFile
              if err := json.Unmarshal(body, &loc); err != nil {
                  return fmt.Errorf("%s: %w", path, err)
              }
              if strings.TrimSpace(loc.Language) == "" {
                  return fmt.Errorf("%s: language is required", path)
              }
              if len(loc.Messages) == 0 {
                  return fmt.Errorf("%s: messages must not be empty", path)
              }
              locales = append(locales, loc)
              return nil
          })
          sort.Slice(locales, func(i, j int) bool { return locales[i].Language < locales[j].Language })
          return locales, err
      }

      func render(locales []localeFile) ([]byte, error) {
          var b bytes.Buffer
          fmt.Fprintln(&b, "// Code generated by make i18n; DO NOT EDIT.")
          fmt.Fprintln(&b, "package i18n")
          fmt.Fprintln(&b, "func init() {")
          for _, loc := range locales {
              sort.Strings(loc.Aliases)
              fmt.Fprintf(&b, "\tRegisterLanguage(%s", strconv.Quote(loc.Language))
              for _, alias := range loc.Aliases {
                  fmt.Fprintf(&b, ", %s", strconv.Quote(alias))
              }
              fmt.Fprintln(&b, ")")
              keys := make([]string, 0, len(loc.Messages))
              for key, message := range loc.Messages {
                  if strings.TrimSpace(key) == "" || strings.TrimSpace(message) == "" {
                      return nil, fmt.Errorf("%s: message keys and values must not be empty", loc.Language)
                  }
                  keys = append(keys, key)
              }
              sort.Strings(keys)
              for _, key := range keys {
                  fmt.Fprintf(&b, "\tRegister(%s, %s, %s)\n", strconv.Quote(loc.Language), strconv.Quote(key), strconv.Quote(loc.Messages[key]))
              }
          }
          fmt.Fprintln(&b, "}")
          return format.Source(b.Bytes())
      }

      func fatal(err error) {
          fmt.Fprintln(os.Stderr, "i18n-gen:", err)
          os.Exit(1)
      }

  # ── pkg/response ──────────────────────────────────────────────────────────
  - path: internal/pkg/response/response.go
    delims: ["{{", "}}"]
    body: |-
      package response

      import (
          "fmt"
              "strconv"
          "strings"
          "sync"

          "github.com/cloudwego/hertz/pkg/app"
          "github.com/cloudwego/hertz/pkg/protocol/consts"
          "github.com/samber/oops"
          "google.golang.org/protobuf/proto"

          "{{.GoModule}}/internal/pkg/i18n"
      )

          type Definition struct {
              Code   int
              Msg    string
              Status int
          }

          var (
              registryMu sync.RWMutex
              registry   = map[int]Definition{}
          )

      const (
        CodeOK                    = 0
        CodeInternalError         = 10000
        CodeRequestBindFailed     = 10001
        CodeRequestValidateFailed = 10002
        CodeRequestParamMissing   = 10003
        CodeRequestParamInvalid   = 10004
        CodeRequestBodyInvalid    = 10005
        CodeRequestBodyTooLarge   = 10006
        CodeUnsupportedMediaType  = 10007
        CodeRouteNotFound         = 10008
        CodeMethodNotAllowed      = 10009
        CodeNotImplemented        = 10010
        CodeRequestTimeout        = 10011

        CodeUnauthorized      = 10100
        CodeSignatureMissing  = 10101
        CodeSignatureExpired  = 10102
        CodeSignatureInvalid  = 10103
        CodeTokenMissing      = 10104
        CodeTokenInvalid      = 10105
        CodeTokenExpired      = 10106
        CodeClaimsInvalid     = 10107
        CodePermissionDenied  = 10108
        CodeAppKeyInvalid     = 10109
        CodeSessionInvalid    = 10110

        CodeRateLimited          = 10200
        CodeDuplicateRequest     = 10201
        CodeReplayRequest        = 10202
        CodeIdempotencyKeyMissing = 10203
        CodeIdempotencyConflict  = 10204

        CodeDependencyError          = 10300
        CodeRPCFailed                = 10301
        CodeRPCTimeout               = 10302
        CodeDatabaseUnavailable      = 10303
        CodeCacheUnavailable         = 10304
        CodeMessageQueueUnavailable  = 10305
        CodeSearchUnavailable        = 10306
        CodeStorageUnavailable       = 10307
        CodeConfigInvalid            = 10308
        CodeDataDecodeFailed         = 10309
      )

          type ErrBody struct {
              Code int    `json:"code"`
              Msg  string `json:"msg"`
          }

          type Body struct {
              Code int    `json:"code"`
              Msg  string `json:"msg"`
              Data any    `json:"data,omitempty"`
          }

      func Reply(c *app.RequestContext, status int, payload any) {
          accept := strings.ToLower(c.Request.Header.Get(consts.HeaderAccept))
          if strings.Contains(accept, consts.MIMEPROTOBUF) {
              if msg, ok := payload.(proto.Message); ok {
                  c.ProtoBuf(status, msg)
                  return
              }
          }
          c.JSON(status, localizePayload(c, payload))
      }

      func OK(c *app.RequestContext, payload any) {
          accept := strings.ToLower(c.Request.Header.Get(consts.HeaderAccept))
          if strings.Contains(accept, consts.MIMEPROTOBUF) {
              if msg, ok := payload.(proto.Message); ok {
                  c.ProtoBuf(consts.StatusOK, msg)
                  return
              }
          }
          Reply(c, consts.StatusOK, Body{Code: CodeOK, Msg: MsgFromCode(CodeOK), Data: payload})
      }

      func ErrorCode(c *app.RequestContext, code int) {
          Reply(c, StatusFromCode(code), ErrBody{Code: code, Msg: MsgFromCode(code)})
      }

      func BindError(c *app.RequestContext, err error) {
          _ = err
              ErrorCode(c, CodeRequestBindFailed)
      }

      func Err(c *app.RequestContext, err error) {
          code, msg := CodeMsg(err)
          Reply(c, StatusFromCode(code), ErrBody{Code: code, Msg: msg})
      }

      func localizePayload(c *app.RequestContext, payload any) any {
          lang := i18n.FromAcceptLanguage(c.Request.Header.Get(i18n.HeaderAcceptLanguage))
          c.Response.Header.Set(i18n.HeaderContentLanguage, lang)
          switch body := payload.(type) {
          case Body:
              body.Msg = i18n.Translate(lang, body.Msg)
              return body
          case ErrBody:
              body.Msg = i18n.Translate(lang, body.Msg)
              return body
          default:
              return payload
          }
      }

      func StatusFromCode(code int) int {
          if def, ok := DefinitionFromCode(code); ok {
              return def.Status
          }
          if code >= 20000 && code < 90000 {
              return consts.StatusBadRequest
          }
          return consts.StatusInternalServerError
      }

      func MsgFromCode(code int) string {
          if def, ok := DefinitionFromCode(code); ok {
              return def.Msg
          }
          return "internal_error"
      }

      func Register(def Definition) {
          if def.Code >= 10000 && def.Code <= 10399 {
              panic("response: scaffold error code is reserved")
          }
          if def.Code <= 0 || def.Msg == "" || def.Status <= 0 {
              panic("response: invalid error definition")
          }
          registryMu.Lock()
          defer registryMu.Unlock()
          registry[def.Code] = def
      }

      func MustRegister(def Definition) Definition {
          Register(def)
          return def
      }

      func DefinitionFromCode(code int) (Definition, bool) {
          if def, ok := builtinDefinition(code); ok {
              return def, true
          }
          registryMu.RLock()
          defer registryMu.RUnlock()
          def, ok := registry[code]
          return def, ok
      }

      func builtinDefinition(code int) (Definition, bool) {
          switch code {
          case CodeOK:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusOK}, true
          case CodeInternalError, CodeConfigInvalid, CodeDataDecodeFailed:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusInternalServerError}, true
          case CodeRequestBindFailed, CodeRequestValidateFailed, CodeRequestParamMissing,
              CodeRequestParamInvalid, CodeRequestBodyInvalid, CodeIdempotencyKeyMissing:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusBadRequest}, true
          case CodeRequestBodyTooLarge:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusRequestEntityTooLarge}, true
          case CodeUnsupportedMediaType:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusUnsupportedMediaType}, true
          case CodeRouteNotFound:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusNotFound}, true
          case CodeMethodNotAllowed:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusMethodNotAllowed}, true
          case CodeNotImplemented:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusNotImplemented}, true
          case CodeRequestTimeout:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusGatewayTimeout}, true
          case CodeUnauthorized, CodeSignatureMissing, CodeSignatureExpired, CodeTokenMissing,
              CodeTokenInvalid, CodeTokenExpired, CodeClaimsInvalid, CodeAppKeyInvalid,
              CodeSessionInvalid:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusUnauthorized}, true
          case CodeSignatureInvalid, CodePermissionDenied:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusForbidden}, true
          case CodeRateLimited:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusTooManyRequests}, true
          case CodeDuplicateRequest, CodeReplayRequest, CodeIdempotencyConflict:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusConflict}, true
          case CodeRPCFailed:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusBadGateway}, true
          case CodeRPCTimeout:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusGatewayTimeout}, true
          case CodeDependencyError, CodeDatabaseUnavailable, CodeCacheUnavailable,
              CodeMessageQueueUnavailable, CodeSearchUnavailable, CodeStorageUnavailable:
              return Definition{Code: code, Msg: builtinMsg(code), Status: consts.StatusServiceUnavailable}, true
          default:
              return Definition{}, false
          }
      }

      func builtinMsg(code int) string {
          switch code {
          case CodeOK:
              return "ok"
          case CodeInternalError:
              return "internal_error"
          case CodeRequestBindFailed:
              return "request_bind_failed"
          case CodeRequestValidateFailed:
              return "request_validate_failed"
          case CodeRequestParamMissing:
              return "request_param_missing"
          case CodeRequestParamInvalid:
              return "request_param_invalid"
          case CodeRequestBodyInvalid:
              return "request_body_invalid"
          case CodeRequestBodyTooLarge:
              return "request_body_too_large"
          case CodeUnsupportedMediaType:
              return "unsupported_media_type"
          case CodeRouteNotFound:
              return "route_not_found"
          case CodeMethodNotAllowed:
              return "method_not_allowed"
          case CodeNotImplemented:
              return "not_implemented"
          case CodeRequestTimeout:
              return "request_timeout"
          case CodeUnauthorized:
              return "unauthorized"
          case CodeSignatureMissing:
              return "signature_missing"
          case CodeSignatureExpired:
              return "signature_expired"
          case CodeSignatureInvalid:
              return "signature_invalid"
          case CodeTokenMissing:
              return "token_missing"
          case CodeTokenInvalid:
              return "token_invalid"
          case CodeTokenExpired:
              return "token_expired"
          case CodeClaimsInvalid:
              return "token_claims_invalid"
          case CodePermissionDenied:
              return "permission_denied"
          case CodeAppKeyInvalid:
              return "app_key_invalid"
          case CodeSessionInvalid:
              return "session_invalid"
          case CodeRateLimited:
              return "rate_limited"
          case CodeDuplicateRequest:
              return "duplicate_request"
          case CodeReplayRequest:
              return "replay_request"
          case CodeIdempotencyKeyMissing:
              return "idempotency_key_missing"
          case CodeIdempotencyConflict:
              return "idempotency_conflict"
          case CodeDependencyError:
              return "dependency_error"
          case CodeRPCFailed:
              return "rpc_failed"
          case CodeRPCTimeout:
              return "rpc_timeout"
          case CodeDatabaseUnavailable:
              return "database_unavailable"
          case CodeCacheUnavailable:
              return "cache_unavailable"
          case CodeMessageQueueUnavailable:
              return "message_queue_unavailable"
          case CodeSearchUnavailable:
              return "search_unavailable"
          case CodeStorageUnavailable:
              return "storage_unavailable"
          case CodeConfigInvalid:
              return "config_invalid"
          case CodeDataDecodeFailed:
              return "data_decode_failed"
          default:
              return "internal_error"
          }
      }

          func CodeMsg(err error) (int, string) {
        code := CodeInternalError
              public := ""
              msg := "internal_error"
          if oe, ok := oops.AsOops(err); ok {
                  code = codeFromOops(oe.Code(), code)
              if value := oe.Public(); value != "" {
                      public = value
              }
          }
              if def, ok := DefinitionFromCode(code); ok {
                  return code, def.Msg
              }
              if public != "" {
                  return code, public
              }
              return code, msg
          }

          func codeFromOops(value any, fallbackCode int) int {
              if value == nil {
                  return fallbackCode
              }
              switch v := value.(type) {
              case int:
                  return v
              case int64:
                  return int(v)
              case int32:
                  return int(v)
              case uint:
                  return int(v)
              case uint64:
                  return int(v)
              case uint32:
                  return int(v)
              case string:
                  if parsed, err := strconv.Atoi(v); err == nil {
                      return parsed
                  }
                  return fallbackCode
              default:
                  if parsed, err := strconv.Atoi(fmt.Sprint(v)); err == nil {
                      return parsed
                  }
                  return fallbackCode
              }
      }

