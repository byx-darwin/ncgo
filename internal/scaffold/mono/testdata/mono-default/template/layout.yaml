  - path: internal/pkg/middleware/signature.go
    delims: ["{{", "}}"]
    body: |-
      package middleware

      import (
          "context"
          "crypto/hmac"
          "crypto/sha256"
          "crypto/subtle"
          "encoding/hex"
          "strconv"
          "strings"
          "sync"
          "time"

          "github.com/cloudwego/hertz/pkg/app"
          "github.com/redis/go-redis/v9"
              "github.com/samber/hot"
          "github.com/samber/oops"

          "{{.GoModule}}/internal/base/conf"
          "{{.GoModule}}/internal/pkg/response"
      )

      type SecretResolver interface {
          Secret(ctx context.Context, appKey string) (string, error)
      }

      type StaticSecretResolver struct {
          SecretValue string
      }

      type signatureNonceStore interface {
          Mark(ctx context.Context, key string, ttl time.Duration) (bool, error)
      }

      type memorySignatureNonceStore struct {
              mu    sync.Mutex
              cache *hot.HotCache[string, struct{}]
      }

      type redisSignatureNonceStore struct {
          client redis.UniversalClient
      }

      func (r StaticSecretResolver) Secret(ctx context.Context, appKey string) (string, error) {
          _ = ctx
          _ = appKey
          if r.SecretValue == "" {
              return "", oops.In("signature").Code(response.CodeConfigInvalid).Public(response.MsgFromCode(response.CodeConfigInvalid)).New("signature secret is empty")
          }
          return r.SecretValue, nil
      }

      func SignatureAuth(cfg conf.SignatureConfig, resolver SecretResolver) app.HandlerFunc {
          cfg = normalizeSignatureConfig(cfg)
          nonceStore := newSignatureNonceStore(cfg.Nonce)
          nonceTTL := durationSeconds(cfg.Nonce.TTLSeconds)
          return func(ctx context.Context, c *app.RequestContext) {
              if !cfg.Enabled {
                  c.Next(ctx)
                  return
              }
              appKey := c.Request.Header.Get(cfg.HeaderAppKey)
              timestamp := c.Request.Header.Get(cfg.HeaderTimestamp)
              nonce := c.Request.Header.Get(cfg.HeaderNonce)
              signature := c.Request.Header.Get(cfg.HeaderSignature)
              if appKey == "" || timestamp == "" || nonce == "" || signature == "" {
                  abort(c, response.CodeSignatureMissing)
                  return
              }
              if !validTimestamp(timestamp, cfg.MaxClockSkewSeconds) {
                  abort(c, response.CodeSignatureExpired)
                  return
              }
              secret, err := resolver.Secret(ctx, appKey)
              if err != nil {
                  code, _ := response.CodeMsg(err)
                  abort(c, code)
                  return
              }
              expected := ComputeSignature(secret, CanonicalRequest(c, timestamp, nonce))
              if subtle.ConstantTimeCompare([]byte(strings.ToLower(signature)), []byte(expected)) != 1 {
                  abort(c, response.CodeSignatureInvalid)
                  return
              }
              if cfg.Nonce.Enabled {
                  ok, err := nonceStore.Mark(ctx, signatureNonceKey(cfg.Nonce.KeyPrefix, appKey, nonce), nonceTTL)
                  if err != nil {
                      if cfg.Nonce.FailOpen {
                          c.Next(ctx)
                          return
                      }
                      abort(c, response.CodeCacheUnavailable)
                      return
                  }
                  if !ok {
                      abort(c, response.CodeReplayRequest)
                      return
                  }
              }
              c.Next(ctx)
          }
      }

      func newSignatureNonceStore(cfg conf.SignatureNonceConfig) signatureNonceStore {
          if cfg.Enabled && cfg.Backend == "redis" {
              return &redisSignatureNonceStore{client: redis.NewUniversalClient(redisUniversalOptions(cfg.Redis))}
          }
              return newMemorySignatureNonceStore(cfg.Memory.MaxEntries)
      }

          func newMemorySignatureNonceStore(maxEntries int) *memorySignatureNonceStore {
              return &memorySignatureNonceStore{cache: hot.NewHotCache[string, struct{}](hot.LRU, memoryCacheMaxEntries(maxEntries)).Build()}
          }

      func (s *memorySignatureNonceStore) Mark(ctx context.Context, key string, ttl time.Duration) (bool, error) {
          _ = ctx
          if ttl <= 0 {
              ttl = 300 * time.Second
          }
          s.mu.Lock()
          defer s.mu.Unlock()
              if _, found, err := s.cache.Get(key); err != nil {
                  return false, err
              } else if found {
              return false, nil
          }
              s.cache.SetWithTTL(key, struct{}{}, ttl)
          return true, nil
      }

      func (s *redisSignatureNonceStore) Mark(ctx context.Context, key string, ttl time.Duration) (bool, error) {
          if ttl <= 0 {
              ttl = 300 * time.Second
          }
          return s.client.SetNX(ctx, key, "1", ttl).Result()
      }

      func signatureNonceKey(prefix, appKey, nonce string) string {
          replacer := strings.NewReplacer(":", "_", " ", "_", "\n", "_")
          parts := []string{prefix, "signature_nonce", appKey, nonce}
          safe := make([]string, 0, len(parts))
          for _, part := range parts {
              part = strings.TrimSpace(part)
              if part == "" {
                  continue
              }
              safe = append(safe, replacer.Replace(part))
          }
          return strings.Join(safe, ":")
      }

      func CanonicalRequest(c *app.RequestContext, timestamp, nonce string) string {
          return strings.Join([]string{
              string(c.Method()),
              string(c.Path()),
              string(c.Request.URI().QueryString()),
              timestamp,
              nonce,
              string(c.Request.Body()),
          }, "\n")
      }

      func ComputeSignature(secret, canonical string) string {
          mac := hmac.New(sha256.New, []byte(secret))
          _, _ = mac.Write([]byte(canonical))
          return hex.EncodeToString(mac.Sum(nil))
      }

      func validTimestamp(value string, skew int64) bool {
          if skew <= 0 {
              skew = 300
          }
          ts, err := strconv.ParseInt(value, 10, 64)
          if err != nil {
              return false
          }
          delta := time.Now().Unix() - ts
          return delta <= skew && delta >= -skew
      }

      func normalizeSignatureConfig(cfg conf.SignatureConfig) conf.SignatureConfig {
          if cfg.HeaderAppKey == "" {
              cfg.HeaderAppKey = "X-App-Key"
          }
          if cfg.HeaderTimestamp == "" {
              cfg.HeaderTimestamp = "X-Timestamp"
          }
          if cfg.HeaderNonce == "" {
              cfg.HeaderNonce = "X-Nonce"
          }
          if cfg.HeaderSignature == "" {
              cfg.HeaderSignature = "X-Signature"
          }
          if cfg.MaxClockSkewSeconds <= 0 {
              cfg.MaxClockSkewSeconds = 300
          }
          cfg.Nonce = normalizeSignatureNonceConfig(cfg.Nonce)
          return cfg
      }

      func normalizeSignatureNonceConfig(cfg conf.SignatureNonceConfig) conf.SignatureNonceConfig {
          if cfg.Backend == "" {
              cfg.Backend = "memory"
          }
          if cfg.KeyPrefix == "" {
              cfg.KeyPrefix = "signature_nonce"
          }
          if cfg.TTLSeconds <= 0 {
              cfg.TTLSeconds = 300
          }
              if cfg.Memory.MaxEntries <= 0 {
                  cfg.Memory.MaxEntries = defaultMemoryCacheMaxEntries
              }
          if cfg.Backend == "redis" && len(cfg.Redis.Addrs) == 0 {
              cfg.Redis.Addrs = []string{"127.0.0.1:6379"}
          }
          return cfg
      }

      func abort(c *app.RequestContext, code int) {
          response.Reply(c, response.StatusFromCode(code), response.ErrBody{Code: code, Msg: response.MsgFromCode(code)})
          c.Abort()
      }

  - path: internal/pkg/middleware/signature_test.go
    delims: ["{{", "}}"]
    body: |-
      package middleware

      import (
          "context"
          "strconv"
          "testing"
          "time"

          "github.com/cloudwego/hertz/pkg/app"
          "github.com/cloudwego/hertz/pkg/protocol"
          "github.com/cloudwego/hertz/pkg/protocol/consts"

          "{{.GoModule}}/internal/base/conf"
      )

      func TestSignatureNonceRejectsReplay(t *testing.T) {
          cfg := conf.SignatureConfig{Enabled: true, StaticSecret: "secret", Nonce: conf.SignatureNonceConfig{Enabled: true, Backend: "memory", KeyPrefix: "test", TTLSeconds: 300}}
          mw := SignatureAuth(cfg, StaticSecretResolver{SecretValue: "secret"})
          timestamp := strconv.FormatInt(time.Now().Unix(), 10)

          first := newSignedSignatureContext(t, "secret", "app-1", "nonce-1", timestamp)
          mw(context.Background(), first)
          if first.Response.StatusCode() == consts.StatusConflict {
              t.Fatalf("first request was treated as replay")
          }

          second := newSignedSignatureContext(t, "secret", "app-1", "nonce-1", timestamp)
          mw(context.Background(), second)
          if second.Response.StatusCode() != consts.StatusConflict {
              t.Fatalf("status = %d, want %d", second.Response.StatusCode(), consts.StatusConflict)
          }
          if got, want := string(second.Response.Body()), `{"code":10202,"msg":"replay_request"}`; got != want {
              t.Fatalf("body = %s, want %s", got, want)
          }
      }

      func TestSignatureInvalidDoesNotConsumeNonce(t *testing.T) {
          cfg := conf.SignatureConfig{Enabled: true, StaticSecret: "secret", Nonce: conf.SignatureNonceConfig{Enabled: true, Backend: "memory", KeyPrefix: "test", TTLSeconds: 300}}
          mw := SignatureAuth(cfg, StaticSecretResolver{SecretValue: "secret"})
          timestamp := strconv.FormatInt(time.Now().Unix(), 10)

          invalid := newSignedSignatureContext(t, "secret", "app-1", "nonce-2", timestamp)
          invalid.Request.Header.Set("X-Signature", "bad")
          mw(context.Background(), invalid)
          if invalid.Response.StatusCode() != consts.StatusForbidden {
              t.Fatalf("status = %d, want %d", invalid.Response.StatusCode(), consts.StatusForbidden)
          }

          valid := newSignedSignatureContext(t, "secret", "app-1", "nonce-2", timestamp)
          mw(context.Background(), valid)
          if valid.Response.StatusCode() == consts.StatusConflict {
              t.Fatalf("valid request was treated as replay after invalid signature")
          }
      }

      func TestSignatureNonceKeySanitizesParts(t *testing.T) {
          if got, want := signatureNonceKey("test", "app:1", "nonce 1"), "test:signature_nonce:app_1:nonce_1"; got != want {
              t.Fatalf("key = %q, want %q", got, want)
          }
      }

      func TestMemorySignatureNonceStoreEvictsLRU(t *testing.T) {
          store := newMemorySignatureNonceStore(1)
          if ok, err := store.Mark(context.Background(), "k1", time.Minute); err != nil || !ok {
              t.Fatalf("mark k1 = %v, %v", ok, err)
          }
          if ok, err := store.Mark(context.Background(), "k2", time.Minute); err != nil || !ok {
              t.Fatalf("mark k2 = %v, %v", ok, err)
          }
          if ok, err := store.Mark(context.Background(), "k1", time.Minute); err != nil || !ok {
              t.Fatalf("mark evicted k1 = %v, %v; want fresh insert after LRU eviction", ok, err)
          }
      }

      func newSignedSignatureContext(t *testing.T, secret, appKey, nonce, timestamp string) *app.RequestContext {
          t.Helper()
          c := app.NewContext(0)
          req := protocol.NewRequest("GET", "/ping?message=hello", nil)
          req.Header.Set("X-App-Key", appKey)
          req.Header.Set("X-Timestamp", timestamp)
          req.Header.Set("X-Nonce", nonce)
          req.CopyTo(&c.Request)
          c.Request.Header.Set("X-Signature", ComputeSignature(secret, CanonicalRequest(c, timestamp, nonce)))
          return c
      }

  # ── pkg/middleware: token/JWT ─────────────────────────────────────────────
  - path: internal/pkg/middleware/token.go
    delims: ["{{", "}}"]
    body: |-
      package middleware

      import (
          "context"
          "errors"
          "strings"

          "github.com/cloudwego/hertz/pkg/app"
          "github.com/golang-jwt/jwt/v5"
          "github.com/samber/oops"

          "{{.GoModule}}/internal/base/conf"
          "{{.GoModule}}/internal/pkg/response"
      )

      const ContextKeyTokenClaims = "tokenClaims"

      type Claims struct {
          UserID string `json:"user_id"`
          UUID   string `json:"uuid"`
          AK     string `json:"ak"`
          jwt.RegisteredClaims
      }

      type TokenVerifier interface {
          VerifyToken(ctx context.Context, token string) (*Claims, error)
      }

      type JWTVerifier struct {
          Config conf.TokenConfig
      }

      func JWTAuth(cfg conf.TokenConfig) app.HandlerFunc {
          return TokenAuth(cfg, JWTVerifier{Config: cfg})
      }

      func TokenAuth(cfg conf.TokenConfig, verifier TokenVerifier) app.HandlerFunc {
          return func(ctx context.Context, c *app.RequestContext) {
              if !cfg.Enabled {
                  c.Next(ctx)
                  return
              }
              header := cfg.Header
              if header == "" {
                  header = "X-Authorization"
              }
              token := strings.TrimSpace(c.Request.Header.Get(header))
              if strings.HasPrefix(strings.ToLower(token), "bearer ") {
                  token = strings.TrimSpace(token[7:])
              }
              if token == "" {
                  abort(c, response.CodeTokenMissing)
                  return
              }
              claims, err := verifier.VerifyToken(ctx, token)
              if err != nil {
                  code, _ := response.CodeMsg(err)
                  abort(c, code)
                  return
              }
              c.Set(ContextKeyTokenClaims, claims)
              c.Next(ctx)
          }
      }

      func (v JWTVerifier) VerifyToken(ctx context.Context, tokenString string) (*Claims, error) {
          _ = ctx
          if v.Config.SigningKey == "" {
              return nil, oops.In("token").Code(response.CodeConfigInvalid).Public(response.MsgFromCode(response.CodeConfigInvalid)).New("token signing key is empty")
          }
          claims := &Claims{}
          options := make([]jwt.ParserOption, 0, 1)
          if v.Config.Issuer != "" {
              options = append(options, jwt.WithIssuer(v.Config.Issuer))
          }
          token, err := jwt.ParseWithClaims(tokenString, claims, func(token *jwt.Token) (any, error) {
              if _, ok := token.Method.(*jwt.SigningMethodHMAC); !ok {
                  return nil, oops.In("token").Code(response.CodeTokenInvalid).Public(response.MsgFromCode(response.CodeTokenInvalid)).New("invalid token signing method")
              }
              return []byte(v.Config.SigningKey), nil
          }, options...)
          if err != nil {
              if errors.Is(err, jwt.ErrTokenExpired) {
                  return nil, oops.In("token").Code(response.CodeTokenExpired).Public(response.MsgFromCode(response.CodeTokenExpired)).Wrap(err)
              }
              if errors.Is(err, jwt.ErrTokenInvalidClaims) || errors.Is(err, jwt.ErrTokenNotValidYet) {
                  return nil, oops.In("token").Code(response.CodeClaimsInvalid).Public(response.MsgFromCode(response.CodeClaimsInvalid)).Wrap(err)
              }
              return nil, oops.In("token").Code(response.CodeTokenInvalid).Public(response.MsgFromCode(response.CodeTokenInvalid)).Wrap(err)
          }
          if token == nil || !token.Valid {
              return nil, oops.In("token").Code(response.CodeTokenInvalid).Public(response.MsgFromCode(response.CodeTokenInvalid)).New("token is invalid")
          }
          return claims, nil
      }

      func GetClaims(c *app.RequestContext) (*Claims, bool) {
          value, ok := c.Get(ContextKeyTokenClaims)
          if !ok {
              return nil, false
          }
          claims, ok := value.(*Claims)
          return claims, ok
      }

