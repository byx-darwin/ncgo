          SkipPaths  []string             `json:"skip_paths" yaml:"skip_paths"`
          Memory     MemoryCacheConfig    `json:"memory" yaml:"memory"`
          Redis      RateLimitRedisConfig `json:"redis" yaml:"redis"`
      }

      type AuthConfig struct {
          PublicPaths []string        `json:"public_paths" yaml:"public_paths"`
          Signature SignatureConfig `json:"signature" yaml:"signature"`
          Token     TokenConfig     `json:"token" yaml:"token"`
      }

      type SignatureConfig struct {
          Enabled             bool   `json:"enabled" yaml:"enabled"`
          HeaderAppKey        string `json:"header_app_key" yaml:"header_app_key"`
          HeaderTimestamp     string `json:"header_timestamp" yaml:"header_timestamp"`
          HeaderNonce         string `json:"header_nonce" yaml:"header_nonce"`
          HeaderSignature     string `json:"header_signature" yaml:"header_signature"`
          StaticSecret        string `json:"static_secret" yaml:"static_secret"`
          MaxClockSkewSeconds int64  `json:"max_clock_skew_seconds" yaml:"max_clock_skew_seconds"`
          Nonce               SignatureNonceConfig `json:"nonce" yaml:"nonce"`
      }

      type SignatureNonceConfig struct {
          Enabled    bool                 `json:"enabled" yaml:"enabled"`
          Backend    string               `json:"backend" yaml:"backend"`
          FailOpen   bool                 `json:"fail_open" yaml:"fail_open"`
          KeyPrefix  string               `json:"key_prefix" yaml:"key_prefix"`
          TTLSeconds int                  `json:"ttl_seconds" yaml:"ttl_seconds"`
          Memory     MemoryCacheConfig    `json:"memory" yaml:"memory"`
          Redis      RateLimitRedisConfig `json:"redis" yaml:"redis"`
      }

      type TokenConfig struct {
          Enabled        bool   `json:"enabled" yaml:"enabled"`
          Header         string `json:"header" yaml:"header"`
          Issuer         string `json:"issuer" yaml:"issuer"`
          SigningKey     string `json:"signing_key" yaml:"signing_key"`
          BufferSeconds  int64  `json:"buffer_seconds" yaml:"buffer_seconds"`
          ExpiresSeconds int64  `json:"expires_seconds" yaml:"expires_seconds"`
      }

      func Init() error {
          once.Do(func() { current, initErr = Load("") })
          return initErr
      }

      func Get() *Config {
          if current == nil {
              _ = Init()
          }
          return current
      }

      func Load(path string) (*Config, error) {
          cfg := Default()
          if path == "" {
              path = os.Getenv("CONFIG_PATH")
          }
          configPathFromEnv := path != ""
          if path == "" {
              path = filepath.Join("conf", Env(), "conf.yaml")
          }
          content, err := os.ReadFile(path)
          if err != nil {
              if os.IsNotExist(err) && !configPathFromEnv {
                  return cfg, nil
              }
              return nil, oops.In("config").Code(10308).
                  Public("config_invalid").With("path", path).Wrap(err)
          }
          if err := yaml.Unmarshal(content, cfg); err != nil {
              return nil, oops.In("config").Code(10308).
                  Public("config_invalid").With("path", path).Wrap(err)
          }
          if err := cfg.Validate(); err != nil {
              return nil, err
          }
          return cfg, nil
      }

