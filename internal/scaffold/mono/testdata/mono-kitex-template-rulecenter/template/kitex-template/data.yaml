# Kitex custom template — base/data.go
# Generates the core infrastructure layer: native pgx PostgreSQL pool + sqlc Queries.
# Optional add-ons (Redis / Kafka / ES / ClickHouse) live under skills/golang-kitex/assets/optional/.
# Wire up New() via samber/do in internal/base/server/server.go.
path: internal/base/data/data.go
update_behavior:
  type: cover
body: |-
  // Code generated by kitex generator.

  package data

  import (
      "context"

      "github.com/jackc/pgx/v5/pgxpool"
      goerror "github.com/byx-darwin/go-tools/go-common/error"

      "{{.Module}}/internal/db/gen"
  )

  // Data holds shared infrastructure clients.
  // All fields are safe for concurrent use.
  // Add optional clients (Redis / Kafka / ES / ClickHouse) by copying files
  // from the skill's assets/optional/ directory into this package.
  type Data struct {
      Pool    *pgxpool.Pool // native pgx pool — supports Batch, CopyFrom, LISTEN/NOTIFY
      Queries *gen.Queries  // sqlc-generated query methods
  }

  // New initialises core infrastructure connections.
  // Wire up via samber/do in internal/base/server/server.go.
  func New(pool *pgxpool.Pool) (*Data, func(), error) {
      queries := gen.New(pool)
      cleanup := func() {
          pool.Close()
      }
      return &Data{
          Pool:    pool,
          Queries: queries,
      }, cleanup, nil
  }

  // NewPostgres opens and validates a PostgreSQL connection pool via native pgx/v5.
  // Pass the full *pgxpool.Config via samber/do so every pool option is available.
  func NewPostgres(ctx context.Context, cfg *pgxpool.Config) (*pgxpool.Pool, error) {
      if cfg == nil {
          return nil, goerror.
              In("postgres").
              Tags("database", "postgres", "connection").
              Code("postgres_config_missing").
              Public("database configuration is invalid").
              New("pgxpool.Config is nil")
      }
      pool, err := pgxpool.NewWithConfig(ctx, cfg)
      if err != nil {
          return nil, goerror.
              In("postgres").
              Tags("database", "postgres", "connection").
              Code("postgres_pool_open_failed").
              Public("database is unavailable").
              With("max_conns", cfg.MaxConns).
              With("min_conns", cfg.MinConns).
              Wrapf(err, "pgxpool.NewWithConfig")
      }
      if err := pool.Ping(ctx); err != nil {
          pool.Close()
          return nil, goerror.
              In("postgres").
              Tags("database", "postgres", "connection").
              Code("postgres_ping_failed").
              Public("database is unavailable").
              With("max_conns", cfg.MaxConns).
              With("min_conns", cfg.MinConns).
              Wrapf(err, "pool.Ping")
      }
      return pool, nil
  }

  // NewPostgresConfig parses a DSN into pgxpool.Config.
  // Mutate the returned config in conf/server wiring to set MaxConns, MinConns,
  // MaxConnLifetime, MaxConnIdleTime, HealthCheckPeriod, ConnConfig, hooks, etc.
  func NewPostgresConfig(dsn string) (*pgxpool.Config, error) {
      if dsn == "" {
          return nil, goerror.
              In("postgres").
              Tags("database", "postgres", "configuration").
              Code("postgres_dsn_missing").
              Public("database configuration is invalid").
              New("postgres DSN is empty")
      }
      cfg, err := pgxpool.ParseConfig(dsn)
      if err != nil {
          return nil, goerror.
              In("postgres").
              Tags("database", "postgres", "configuration").
              Code("postgres_config_parse_failed").
              Public("database configuration is invalid").
              Wrapf(err, "pgxpool.ParseConfig")
      }
      return cfg, nil
  }
