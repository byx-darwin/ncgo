# Kitex rule-center preset — handler for RuleService
path: internal/handler/rulecenter/handler.go
update_behavior:
  type: cover
body: |-
  // Code generated by ncgo rule-center preset.

  package rulecenterhandler

  import (
      "context"

      "{{.Module}}/internal/pkg/rpcerror"
      ratelimitv1 "{{.Module}}/kitex_gen/api/ratelimit/v1"
      usecase "{{.Module}}/internal/usecase/rulecenter"
  )

  // RuleServiceImpl implements the Kitex-generated RuleService server interface.
  type RuleServiceImpl struct {
      uc *usecase.UseCase
  }

  func NewRuleServiceImpl(uc *usecase.UseCase) *RuleServiceImpl {
      return &RuleServiceImpl{uc: uc}
  }

  func (s *RuleServiceImpl) GetRule(ctx context.Context, req *ratelimitv1.GetRuleReq) (resp *ratelimitv1.GetRuleResp, err error) {
      rule, found, err := s.uc.GetRule(ctx, req.Service, req.Phase, req.Method, req.Path, req.AppKey)
      if err != nil {
          return nil, rpcerror.ToBizError(err)
      }
      return &ratelimitv1.GetRuleResp{Found: found, Rule: rule}, nil
  }

  func (s *RuleServiceImpl) CreateRule(ctx context.Context, req *ratelimitv1.CreateRuleReq) (resp *ratelimitv1.CreateRuleResp, err error) {
      id, err := s.uc.CreateRule(ctx, req)
      if err != nil {
          return nil, rpcerror.ToBizError(err)
      }
      return &ratelimitv1.CreateRuleResp{Id: id}, nil
  }

  func (s *RuleServiceImpl) UpdateRule(ctx context.Context, req *ratelimitv1.UpdateRuleReq) (resp *ratelimitv1.UpdateRuleResp, err error) {
      err = s.uc.UpdateRule(ctx, req)
      if err != nil {
          return nil, rpcerror.ToBizError(err)
      }
      return &ratelimitv1.UpdateRuleResp{}, nil
  }

  func (s *RuleServiceImpl) DeleteRule(ctx context.Context, req *ratelimitv1.DeleteRuleReq) (resp *ratelimitv1.DeleteRuleResp, err error) {
      err = s.uc.DeleteRule(ctx, req.Id)
      if err != nil {
          return nil, rpcerror.ToBizError(err)
      }
      return &ratelimitv1.DeleteRuleResp{}, nil
  }

  func (s *RuleServiceImpl) ListRules(ctx context.Context, req *ratelimitv1.ListRulesReq) (resp *ratelimitv1.ListRulesResp, err error) {
      page := req.Page
      if page < 1 {
          page = 1
      }
      pageSize := req.PageSize
      if pageSize < 1 {
          pageSize = 20
      }
      if pageSize > 100 {
          pageSize = 100
      }
      rules, total, err := s.uc.ListRules(ctx, req.Service, req.Phase, page, pageSize)
      if err != nil {
          return nil, rpcerror.ToBizError(err)
      }
      return &ratelimitv1.ListRulesResp{
          Rules:    rules,
          Total:    int32(total),
          Page:     page,
          PageSize: pageSize,
      }, nil
  }
