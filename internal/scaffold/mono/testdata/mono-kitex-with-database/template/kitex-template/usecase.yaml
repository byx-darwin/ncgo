# Kitex custom template — usecase per service
# Generates internal/usecase/{service}/usecase.go for each service in the IDL.
path: /internal/usecase/{{ToLower .ServiceInfo.ServiceName}}/usecase.go
update_behavior:
  type: skip
loop_service: true
body: |-
  // Code generated by kitex generator. Edit business logic here.

  package {{.ServiceInfo.ServiceName | ToLower}}

  {{if .ServiceInfo.Methods}}
  import (
      "context"

      goerror "github.com/byx-darwin/go-tools/go-common/error"
      {{.ServiceInfo.PkgRefName}} "{{.ServiceInfo.ImportPath}}"
  )
  {{end}}

  // {{.ServiceInfo.ServiceName}}Repo defines the data-access port for this usecase.
  // Implement it in internal/repository/{{.ServiceInfo.ServiceName | ToLower}}/.
  type {{.ServiceInfo.ServiceName}}Repo interface {
      // TODO: declare repository methods needed by the usecase
      // Example: FindByID(ctx context.Context, id int64) (*model.{{.ServiceInfo.ServiceName}}, error)
  }

  // UseCase orchestrates business logic for {{.ServiceInfo.ServiceName}}.
  // It depends on interfaces (ports), not concrete implementations.
  type UseCase struct {
      repo {{.ServiceInfo.ServiceName}}Repo
  }

  // New creates a UseCase wired to the given repository.
  func New(repo {{.ServiceInfo.ServiceName}}Repo) *UseCase {
      return &UseCase{repo: repo}
  }

  {{if not .ServiceInfo.Methods}}
  // Add RPC methods to idl/{{ToLower .ServiceInfo.ServiceName}}.proto, then rerun `make update`.
  {{end}}
  {{range .ServiceInfo.Methods}}
  // {{.Name}} implements the {{.Name}} business rule.
  func (uc *UseCase) {{.Name}}(ctx context.Context{{range .Args}}, {{LowerFirst .Name}} {{.Type}}{{end}}) (resp {{.Resp.Type}}, err error) {
      // TODO: implement
      _ = ctx
      {{range .Args}}_ = {{LowerFirst .Name}}
      {{end}}
      // Placeholder code 10010 ("not implemented"): it intentionally shares its
      // value with frameworkerror.CodeRPCUnavailable; replace with a
      // domain-specific error code once this method is implemented.
    return nil, goerror.
          In("{{$.ServiceInfo.ServiceName | ToLower}}.usecase").
        Code(10010).
        Public("not_implemented").
          Errorf("{{.Name}}: not implemented")
  }
  {{end}}
