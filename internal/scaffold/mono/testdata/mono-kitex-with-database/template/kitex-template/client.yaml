# Kitex custom template — caller-side client factory
path: pkg/client/{{ToLower .ServiceInfo.ServiceName}}/client.go
update_behavior:
  type: cover
loop_service: true
body: |-
  // Code generated by kitex generator.

  package {{.ServiceInfo.ServiceName | ToLower}}client

  import (
      "context"
      "time"

      "github.com/bytedance/gopkg/cloud/metainfo"
      goerror "github.com/byx-darwin/go-tools/go-common/error"
      frameworkerror "github.com/byx-darwin/go-tools/go-framework/error"
      kitexclient "github.com/cloudwego/kitex/client"
      "github.com/cloudwego/kitex/pkg/endpoint"
      "github.com/cloudwego/kitex/pkg/klog"
      "github.com/cloudwego/kitex/pkg/retry"
      "github.com/cloudwego/kitex/pkg/transmeta"

      svc "{{.ServiceInfo.ImportPath}}/{{ToLower .ServiceInfo.ServiceName}}"
  )

  type Config struct {
      ServiceName                string   `json:"service_name" yaml:"service_name"`
      CallerService              string   `json:"caller_service" yaml:"caller_service"`
      HostPorts                  []string `json:"host_ports" yaml:"host_ports"`
      RPCTimeoutSeconds          int      `json:"rpc_timeout_seconds" yaml:"rpc_timeout_seconds"`
      ConnectTimeoutMilliseconds int      `json:"connect_timeout_milliseconds" yaml:"connect_timeout_milliseconds"`
      EnableMetaInfo             bool     `json:"enable_metainfo" yaml:"enable_metainfo"`
      Retry                      RetryConfig `json:"retry" yaml:"retry"`
  }

  type RetryConfig struct {
      Enabled                       bool    `json:"enabled" yaml:"enabled"`
      MaxRetryTimes                 int     `json:"max_retry_times" yaml:"max_retry_times"`
      MaxDurationMilliseconds       int     `json:"max_duration_milliseconds" yaml:"max_duration_milliseconds"`
      Backoff                       string  `json:"backoff" yaml:"backoff"` // none | fixed | random
      FixedBackoffMilliseconds      int     `json:"fixed_backoff_milliseconds" yaml:"fixed_backoff_milliseconds"`
      RandomBackoffMinMilliseconds  int     `json:"random_backoff_min_milliseconds" yaml:"random_backoff_min_milliseconds"`
      RandomBackoffMaxMilliseconds  int     `json:"random_backoff_max_milliseconds" yaml:"random_backoff_max_milliseconds"`
      CircuitBreakerErrorRate       float64 `json:"circuit_breaker_error_rate" yaml:"circuit_breaker_error_rate"`
      RetrySameNode                 bool    `json:"retry_same_node" yaml:"retry_same_node"`
  }

  func DefaultConfig() Config {
      return Config{
          ServiceName:                "{{ToLower .ServiceInfo.ServiceName}}",
          RPCTimeoutSeconds:          3,
          ConnectTimeoutMilliseconds: 100,
          EnableMetaInfo:             true,
          Retry: RetryConfig{
              Enabled:                 false,
              MaxRetryTimes:           1,
              Backoff:                 "none",
              CircuitBreakerErrorRate: 0.1,
          },
      }
  }

  func New(ctx context.Context, cfg Config, opts ...kitexclient.Option) (svc.Client, error) {
      if err := cfg.Validate(); err != nil {
          return nil, err
      }
      options := make([]kitexclient.Option, 0, len(opts)+6)
      if len(cfg.HostPorts) > 0 {
          options = append(options, kitexclient.WithHostPorts(cfg.HostPorts...))
      }
      if cfg.RPCTimeoutSeconds > 0 {
          options = append(options, kitexclient.WithRPCTimeout(time.Duration(cfg.RPCTimeoutSeconds)*time.Second))
      }
      if cfg.ConnectTimeoutMilliseconds > 0 {
          options = append(options, kitexclient.WithConnectTimeout(time.Duration(cfg.ConnectTimeoutMilliseconds)*time.Millisecond))
      }
      // ncgo:wire:registry:client
      if cfg.EnableMetaInfo {
          options = append(options, kitexclient.WithMetaHandler(transmeta.ClientTTHeaderHandler))
      }
      // Optional client-side structured RPC logs (after `ncgo add infra logging`):
      // import "{{.Module}}/internal/base/logging"
      // options = append(options, kitexclient.WithMiddleware(endpoint.Chain(
      //     logging.KitexRequestID(),
      //     logging.KitexAccessLog(),
      // )))
      // Optional release canary wiring (after `ncgo add infra canary`):
      // import "{{.Module}}/internal/base/release"
      // options = append(options, kitexclient.WithMiddleware(release.KitexTraffic()))
      // options = append(options, kitexclient.WithLoadBalancer(
      //     release.NewKitexCanaryLoadBalancer(cfg.ServiceName, ruleProvider, nil),
      // ))
      // The load balancer filters instances from the configured resolver by
      // release.track metadata; plug Nacos/Polaris discovery in as a resolver.
      // ncgo:wire:kitex-client:middleware
      if cfg.CallerService != "" {
          options = append(options, kitexclient.WithMiddleware(callerServiceMiddleware(cfg.CallerService)))
      }
      if policy := cfg.Retry.failurePolicy(); policy != nil {
          options = append(options, kitexclient.WithFailureRetry(policy))
      }
      options = append(options, opts...)

      rpcClient, err := svc.NewClient(cfg.ServiceName, options...)
      if err != nil {
          klog.CtxErrorf(ctx, "%s client connect failed: %v", cfg.ServiceName, err)
          return nil, goerror.In("kitex.client").Code(frameworkerror.CodeRPCUnavailable).Public("rpc_failed").With("service", cfg.ServiceName).Wrap(err)
      }
      klog.CtxDebugf(ctx, "%s client connected", cfg.ServiceName)
      return rpcClient, nil
  }

  func MustNew(ctx context.Context, cfg Config, opts ...kitexclient.Option) svc.Client {
      cli, err := New(ctx, cfg, opts...)
      if err != nil {
          panic(err)
      }
      return cli
  }

  func (c Config) Validate() error {
      if c.ServiceName == "" {
          return goerror.In("kitex.client").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("client service_name is empty")
      }
      if c.RPCTimeoutSeconds < 0 || c.ConnectTimeoutMilliseconds < 0 {
          return goerror.In("kitex.client").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("client timeout settings must not be negative")
      }
      if err := c.Retry.Validate(); err != nil {
          return err
      }
      return nil
  }

  func callerServiceMiddleware(caller string) endpoint.Middleware {
      return func(next endpoint.Endpoint) endpoint.Endpoint {
          return func(ctx context.Context, req, resp interface{}) error {
              if _, ok := metainfo.GetPersistentValue(ctx, "x-caller-service"); !ok {
                  if _, ok := metainfo.GetValue(ctx, "x-caller-service"); !ok {
                      ctx = metainfo.WithPersistentValue(ctx, "x-caller-service", caller)
                  }
              }
              return next(ctx, req, resp)
          }
      }
  }

  func (c RetryConfig) Validate() error {
      if !c.Enabled {
          return nil
      }
      if c.MaxRetryTimes <= 0 || c.MaxRetryTimes > 5 {
          return goerror.In("kitex.client").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("retry max_retry_times must be between 1 and 5")
      }
      if c.MaxDurationMilliseconds < 0 {
          return goerror.In("kitex.client").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("retry max_duration_milliseconds must not be negative")
      }
      if c.CircuitBreakerErrorRate < 0 || c.CircuitBreakerErrorRate > 0.3 {
          return goerror.In("kitex.client").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("retry circuit_breaker_error_rate must be between 0 and 0.3")
      }
      switch c.Backoff {
      case "", "none":
          return nil
      case "fixed":
          if c.FixedBackoffMilliseconds <= 0 {
              return goerror.In("kitex.client").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("retry fixed_backoff_milliseconds must be positive")
          }
      case "random":
          if c.RandomBackoffMinMilliseconds < 0 || c.RandomBackoffMaxMilliseconds <= c.RandomBackoffMinMilliseconds {
              return goerror.In("kitex.client").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("retry random backoff range is invalid")
          }
      default:
          return goerror.In("kitex.client").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("retry backoff must be one of: none, fixed, random")
      }
      return nil
  }

  func (c RetryConfig) failurePolicy() *retry.FailurePolicy {
      if !c.Enabled {
          return nil
      }
      p := retry.NewFailurePolicy()
      p.WithMaxRetryTimes(c.MaxRetryTimes)
      if c.MaxDurationMilliseconds > 0 {
          p.WithMaxDurationMS(uint32(c.MaxDurationMilliseconds))
      }
      if c.CircuitBreakerErrorRate > 0 {
          p.WithRetryBreaker(c.CircuitBreakerErrorRate)
      }
      switch c.Backoff {
      case "fixed":
          p.WithFixedBackOff(c.FixedBackoffMilliseconds)
      case "random":
          p.WithRandomBackOff(c.RandomBackoffMinMilliseconds, c.RandomBackoffMaxMilliseconds)
      }
      if c.RetrySameNode {
          p.WithRetrySameNode()
      }
      return p
  }
