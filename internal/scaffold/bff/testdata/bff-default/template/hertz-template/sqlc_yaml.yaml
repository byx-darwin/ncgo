# Hertz custom template — internal/db/sqlc.yaml
# sqlc code generation configuration, copied to the scaffold when WithDatabase is enabled.
path: internal/db/sqlc.yaml
update_behavior:
  type: cover
condition: WithDatabase
body: |
  version: "2"
  sql:
    - engine: "postgresql"
      # Paths resolve relative to this file's directory (internal/db/),
      # so use ./query, ./schema, ./gen — NOT internal/db/... (that would
      # double-nest to internal/db/internal/db/... and break `make sqlc`).
      queries: "./query"
      schema: "./schema"
      gen:
        go:
          package: "gen"
          out: "./gen"
          sql_package: "pgx/v5"
          emit_prepared_queries: true
          emit_interface: false
          emit_exact_table_names: false
          emit_empty_slices: true
          emit_exported_queries: false
          emit_json_tags: true
          emit_result_struct_pointers: true
          emit_params_struct_pointers: true
          emit_methods_with_db_argument: false
          emit_pointers_for_null_types: true
          emit_enum_valid_method: true
          emit_all_enum_values: true
          output_db_file_name: "db.go"
          output_models_file_name: "models.go"
          output_querier_file_name: "querier.go"
          output_copyfrom_file_name: "copyfrom.go"
          output_batch_file_name: "batch.go"
          query_parameter_limit: 0
          omit_unused_structs: false
          overrides: []
