syntax = "proto3";

package openapi;

import "openapi/openapi.proto";
import "google/protobuf/descriptor.proto";

option java_multiple_files = true;
option java_outer_classname = "AnnotationsProto";
option java_package = "org.openapi_v3";
option objc_class_prefix = "OAS";
option go_package = "/openapi";

extend google.protobuf.FileOptions {
  openapi.v3.Document document = 1143;
}

extend google.protobuf.MethodOptions {
  openapi.v3.Operation operation = 1143;
}

extend google.protobuf.MessageOptions {
  openapi.v3.Schema schema = 1143;
}

extend google.protobuf.FieldOptions {
  openapi.v3.Parameter parameter = 1144;
}

extend google.protobuf.FieldOptions {
  openapi.v3.Schema property = 1143;
}
