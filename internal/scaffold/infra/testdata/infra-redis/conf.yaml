# ncgo:add-infra:start redis
# Optional Redis config block for Hertz.
# Keep the same top-level structure in conf/dev/conf.yaml and in your config-center payload.
# This block can be shared by internal/base/data/redis.go and by redis-backed middleware.
# Field names align with go-middleware/redis.Config; duration fields use config.Duration ("5s" format).
redis:
  addrs:
    - 127.0.0.1:6379
  username: ""
  password: ""
  db: 0
  master_name: ""
  sentinel_username: ""
  sentinel_password: ""
  protocol: 3
  client_name: ""
  pool_size: 10
  min_idle_conns: 2
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  pool_timeout: "4s"
  conn_max_idle_time: "300s"
  conn_max_lifetime: "1800s"
  max_retries: 3
  min_retry_backoff: "8ms"
  max_retry_backoff: "512ms"
# ncgo:add-infra:end redis
