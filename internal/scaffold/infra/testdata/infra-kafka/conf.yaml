# ncgo:add-infra:start kafka
# Optional Kafka config block for Hertz.
# Keep the same top-level structure in conf/dev/conf.yaml and in your config-center payload.
# Adjust these defaults to match how you wire internal/base/data/kafka.go.
kafka:
  producer:
    enabled: false
    broker:
      - 127.0.0.1:9092
    topic: demo-events
    allow_auto_topic_creation: false
    tls:
      enable: false
      insecure_skip_verify: false
    sasl:
      enable: false
      user: ""
      password: ""
  consumer:
    enabled: false
    broker:
      - 127.0.0.1:9092
    group_id: demo
    topic: demo-events
    min_bytes: 10000
    max_bytes: 10485760
    max_wait: 500ms
    read_batch_timeout: 0s
    tls:
      enable: false
      insecure_skip_verify: false
    sasl:
      enable: false
      user: ""
      password: ""
# ncgo:add-infra:end kafka
