syntax = "proto2";

package validate;

import "google/protobuf/descriptor.proto";

message Int32Rules {
  optional int32 const = 1;
  optional int32 lt = 2;
  optional int32 lte = 3;
  optional int32 gt = 4;
  optional int32 gte = 5;
}

message FieldRules {
  optional Int32Rules int32 = 1;
}

extend google.protobuf.FieldOptions {
  optional FieldRules rules = 1071;
}