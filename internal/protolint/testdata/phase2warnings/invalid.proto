syntax = "proto3";

package demo;

import "google/protobuf/empty.proto";

message HealthResp {}

message PingReq {}

message CommonReq {
  string query = 1;
}

message GetUserResp {
  string name = 1;
}

message SearchReq {
  string f1 = 1;
  string f2 = 2;
  string f3 = 3;
  string f4 = 4;
  string f5 = 5;
  string f6 = 6;
  string f7 = 7;
  string f8 = 8;
  string f9 = 9;
  string f10 = 10;
  string f11 = 11;
  string f12 = 12;
  string f13 = 13;
}

message Result {
  repeated string items = 1;
}

service Demo {
  rpc Health(google.protobuf.Empty) returns (HealthResp) {}
  rpc Ping(PingReq) returns (google.protobuf.Empty) {}
  rpc GetUser(CommonReq) returns (GetUserResp) {}
  rpc Search(SearchReq) returns (Result) {}
}