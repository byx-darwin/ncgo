# Kitex custom template — internal/pkg/rpcerror
path: internal/pkg/rpcerror/rpcerror.go
update_behavior:
  type: cover
body: |-
  // Code generated by kitex generator.

  package rpcerror

  import (
      "fmt"
      "math"

      "github.com/cloudwego/kitex/pkg/kerrors"
      "github.com/samber/oops"
  )

  const (
      CodeInternalError  int32 = 10000
      CodeNotImplemented int32 = 10010
      CodePermissionDenied int32 = 10108
      CodeRPCTimeout     int32 = 10302
      CodeConfigInvalid  int32 = 10308
  )

  func ToBizError(err error) error {
      if err == nil {
          return nil
      }
      if _, ok := kerrors.FromBizStatusError(err); ok {
          return err
      }
      code := CodeInternalError
      message := "internal_error"
      if oe, ok := oops.AsOops(err); ok {
          code = codeFromOops(oe.Code())
          if public := oe.Public(); public != "" {
              message = public
          }
      }
      return kerrors.NewBizStatusError(code, message)
  }

  func InternalErrorf(format string, args ...any) error {
      return oops.In("kitex.server").Code(CodeInternalError).Public("internal_error").Errorf(format, args...)
  }

  func TimeoutError() error {
      return oops.In("kitex.server").Code(CodeRPCTimeout).Public("rpc_timeout").New("rpc request timeout")
  }

  func PermissionDenied(message string) error {
      if message == "" {
          message = "permission denied"
      }
      return oops.In("kitex.server").Code(CodePermissionDenied).Public("permission_denied").New(message)
  }

  func codeFromOops(value any) int32 {
      switch v := value.(type) {
      case int:
          if v >= math.MinInt32 && v <= math.MaxInt32 {
              return int32(v)
          }
      case int32:
          return v
      case int64:
          if v >= math.MinInt32 && v <= math.MaxInt32 {
              return int32(v)
          }
      }
      return CodeInternalError
  }

  func BizCode(err error) (int32, bool) {
      biz, ok := kerrors.FromBizStatusError(err)
      if !ok {
          return 0, false
      }
      return biz.BizStatusCode(), true
  }

  func FormatBiz(err error) string {
      if biz, ok := kerrors.FromBizStatusError(err); ok {
          return fmt.Sprintf("biz_code=%d biz_msg=%q", biz.BizStatusCode(), biz.BizMessage())
      }
      return ""
  }