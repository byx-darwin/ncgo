# Kitex rule-center preset — rate-limit middleware for gRPC service self-protection
path: internal/base/middleware/ratelimit.go
update_behavior:
  type: cover
body: |-
  // Code generated by ncgo rule-center preset.
  //
  // This middleware is a pass-through placeholder. The rule-center service
  // itself does not perform rate-limit interception — it is a rule query
  // service consumed by other Hertz/Kitex services. Rate-limit enforcement
  // for Kitex services will be added in a follow-up.

  package middleware

  import (
      "context"

      "github.com/cloudwego/kitex/pkg/endpoint"
  )

  // RateLimit returns a Kitex middleware placeholder for rule-center.
  func RateLimit() endpoint.Middleware {
      return func(next endpoint.Endpoint) endpoint.Endpoint {
          return func(ctx context.Context, req, resp interface{}) error {
              return next(ctx, req, resp)
          }
      }
  }
