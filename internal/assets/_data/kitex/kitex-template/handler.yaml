# Kitex custom template — handler.go
# Generates a thin RPC handler under internal/handler/<service>/.
# Generates a thin RPC handler that delegates to usecase.
#
# Protobuf only:
#   kitex -module mod -template-dir . -type protobuf idl/svc.proto
path: internal/handler/{{ToLower .ServiceInfo.ServiceName}}/handler.go
update_behavior:
  type: cover
body: |-
  // Code generated by kitex generator.

  package {{.ServiceInfo.ServiceName | ToLower}}handler

  import (
  {{if .ServiceInfo.Methods}}
      "context"

      "{{.Module}}/internal/pkg/rpcerror"
      {{.ServiceInfo.PkgRefName}} "{{.ServiceInfo.ImportPath}}"
  {{end}}
      usecase "{{.Module}}/internal/usecase/{{ToLower .ServiceInfo.ServiceName}}"
  )

  // {{.ServiceInfo.ServiceName}}Impl implements the Kitex-generated server interface.
  // It delegates all business logic to UseCase.
  type {{.ServiceInfo.ServiceName}}Impl struct {
      uc *usecase.UseCase
  }

  // New{{.ServiceInfo.ServiceName}}Impl creates a Kitex handler with its usecase dependency.
  func New{{.ServiceInfo.ServiceName}}Impl(uc *usecase.UseCase) *{{.ServiceInfo.ServiceName}}Impl {
      return &{{.ServiceInfo.ServiceName}}Impl{uc: uc}
  }

  {{if not .ServiceInfo.Methods}}
  // Add RPC methods to idl/{{ToLower .ServiceInfo.ServiceName}}.proto, then rerun `make update`.
  {{end}}
  {{range .ServiceInfo.Methods}}
  // {{.Name}} implements the {{$.ServiceInfo.ServiceName}} RPC method.
  func (s *{{$.ServiceInfo.ServiceName}}Impl) {{.Name}}(ctx context.Context{{range .Args}}, {{LowerFirst .Name}} {{.Type}}{{end}}) (resp {{.Resp.Type}}, err error) {
      resp, err = s.uc.{{.Name}}(ctx{{range .Args}}, {{LowerFirst .Name}}{{end}})
      if err != nil {
        return nil, rpcerror.ToBizError(err)
      }
      return resp, nil
  }
  {{end}}
