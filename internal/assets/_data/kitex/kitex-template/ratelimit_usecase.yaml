# Kitex rule-center preset — usecase for RuleService
path: internal/usecase/rulecenter/usecase.go
update_behavior:
  type: cover
body: |-
  // Code generated by ncgo rule-center preset. Edit business logic here.

  package rulecenter

  import (
      "context"
      "regexp"
      "strings"

      ratelimitv1 "{{.Module}}/kitex_gen/api/ratelimit/v1"
      "{{.Module}}/internal/db/gen"
  )

  // RuleRepo defines the data-access port for rate-limit rules.
  // Implement it in internal/repository/rulecenter/.
  type RuleRepo interface {
      GetRateLimitExactRuleByAppKey(ctx context.Context, service, phase, method, path, appKey string) (gen.RateLimitRule, error)
      GetRateLimitExactRuleFallback(ctx context.Context, service, phase, method, path string) (gen.RateLimitRule, error)
      GetRateLimitPatternRuleByAppKey(ctx context.Context, service, phase, method, path, appKey string) ([]gen.RateLimitRule, error)
      GetRateLimitPatternRuleFallback(ctx context.Context, service, phase, method, path string) ([]gen.RateLimitRule, error)
      CreateRateLimitRule(ctx context.Context, arg gen.CreateRateLimitRuleParams) (int64, error)
      UpdateRateLimitRule(ctx context.Context, arg gen.UpdateRateLimitRuleParams) error
      DeleteRateLimitRule(ctx context.Context, id int64) error
      ListRateLimitRules(ctx context.Context, arg gen.ListRateLimitRulesParams) ([]gen.RateLimitRule, error)
      CountRateLimitRules(ctx context.Context, arg gen.CountRateLimitRulesParams) (int64, error)
  }

  // UseCase orchestrates business logic for the rule-center.
  type UseCase struct {
      repo RuleRepo
  }

  // New creates a UseCase wired to the given repository.
  func New(repo RuleRepo) *UseCase {
      return &UseCase{repo: repo}
  }

  // GetRule looks up a rate-limit rule by service/phase/method/path/app_key.
  // It tries exact matches first (with app_key, then fallback without),
  // then pattern matches (same order). Returns (rule, found, err).
  func (uc *UseCase) GetRule(ctx context.Context, service, phase, method, path string, appKey *string) (*ratelimitv1.RateLimitRule, bool, error) {
      ak := ""
      if appKey != nil {
          ak = *appKey
      }
      // Try exact match with app_key
      if ak != "" {
          if rule, err := uc.repo.GetRateLimitExactRuleByAppKey(ctx, service, phase, method, path, ak); err == nil {
              return toProto(&rule), true, nil
          }
      }
      // Try exact match fallback (app_key IS NULL)
      if rule, err := uc.repo.GetRateLimitExactRuleFallback(ctx, service, phase, method, path); err == nil {
          return toProto(&rule), true, nil
      }
      // Try pattern match with app_key
      if ak != "" {
          if rules, err := uc.repo.GetRateLimitPatternRuleByAppKey(ctx, service, phase, method, path, ak); err == nil && len(rules) > 0 {
              if r := pickBestPattern(rules, path); r != nil {
                  return toProto(r), true, nil
              }
          }
      }
      // Try pattern match fallback
      if rules, err := uc.repo.GetRateLimitPatternRuleFallback(ctx, service, phase, method, path); err == nil && len(rules) > 0 {
          if r := pickBestPattern(rules, path); r != nil {
              return toProto(r), true, nil
          }
      }
      return nil, false, nil
  }

  // CreateRule inserts a new rate-limit rule.
  func (uc *UseCase) CreateRule(ctx context.Context, req *ratelimitv1.CreateRuleReq) (int64, error) {
      ak := ""
      if req.AppKey != nil {
          ak = *req.AppKey
      }
      cfg := req.Config
      if cfg == nil {
          cfg = &ratelimitv1.RateLimitConfig{}
      }
      return uc.repo.CreateRateLimitRule(ctx, gen.CreateRateLimitRuleParams{
          Service:           req.Service,
          Phase:             req.Phase,
          Method:            req.Method,
          MatchKind:         req.MatchKind,
          Path:              req.Path,
          PathPattern:       req.PathPattern,
          AppKey:            appKeyPtr(ak),
          Priority:          cfg.Priority,
          Enabled:           cfg.Enabled,
          KeyBy:             cfg.KeyBy,
          Strategy:          cfg.Strategy,
          WindowSeconds:     int32(cfg.WindowSeconds),
          MaxRequests:       int32(cfg.MaxRequests),
          RequestsPerSecond: float64Ptr(cfg.RequestsPerSecond),
          Burst:             int32Ptr(cfg.Burst),
          ClientTtlSeconds:  int32Ptr(cfg.ClientTtlSeconds),
      })
  }

  // UpdateRule partially updates an existing rule by id.
  func (uc *UseCase) UpdateRule(ctx context.Context, req *ratelimitv1.UpdateRuleReq) error {
      arg := gen.UpdateRateLimitRuleParams{ID: req.Id}
      if req.Enabled != nil {
          arg.Enabled = req.Enabled
      }
      if req.Priority != nil {
          arg.Priority = req.Priority
      }
      if req.Strategy != nil {
          arg.Strategy = req.Strategy
      }
      if req.WindowSeconds != nil {
          arg.WindowSeconds = req.WindowSeconds
      }
      if req.MaxRequests != nil {
          arg.MaxRequests = req.MaxRequests
      }
      if req.RequestsPerSecond != nil {
          arg.RequestsPerSecond = req.RequestsPerSecond
      }
      if req.Burst != nil {
          arg.Burst = req.Burst
      }
      if req.ClientTtlSeconds != nil {
          arg.ClientTtlSeconds = req.ClientTtlSeconds
      }
      if req.KeyBy != nil {
          arg.KeyBy = req.KeyBy
      }
      return uc.repo.UpdateRateLimitRule(ctx, arg)
  }

  // DeleteRule removes a rule by id.
  func (uc *UseCase) DeleteRule(ctx context.Context, id int64) error {
      return uc.repo.DeleteRateLimitRule(ctx, id)
  }

  // ListRules returns rules filtered by optional service and phase,
  // with offset-based pagination (page starts at 1, page_size caps at 100).
  func (uc *UseCase) ListRules(ctx context.Context, service *string, phase *string, page, pageSize int32) ([]*ratelimitv1.RateLimitRule, int64, error) {
      svc := ""
      if service != nil {
          svc = *service
      }
      ph := ""
      if phase != nil {
          ph = *phase
      }
      if page < 1 {
          page = 1
      }
      if pageSize < 1 {
          pageSize = 20
      }
      if pageSize > 100 {
          pageSize = 100
      }
      filter := gen.ListRateLimitRulesParams{
          Service: appKeyPtr(svc),
          Phase:   appKeyPtr(ph),
          Limit:   pageSize,
          Offset:  (page - 1) * pageSize,
      }
      rules, err := uc.repo.ListRateLimitRules(ctx, filter)
      if err != nil {
          return nil, 0, err
      }
      total, err := uc.repo.CountRateLimitRules(ctx, gen.CountRateLimitRulesParams{
          Service: appKeyPtr(svc),
          Phase:   appKeyPtr(ph),
      })
      if err != nil {
          return nil, 0, err
      }
      result := make([]*ratelimitv1.RateLimitRule, len(rules))
      for i := range rules {
          result[i] = toProto(&rules[i])
      }
      return result, total, nil
  }

  func toProto(r *gen.RateLimitRule) *ratelimitv1.RateLimitRule {
      if r == nil {
          return nil
      }
      return &ratelimitv1.RateLimitRule{
          Id:                r.ID,
          Service:           r.Service,
          Phase:             r.Phase,
          Method:            r.Method,
          MatchKind:         r.MatchKind,
          Path:              r.Path,
          PathPattern:       r.PathPattern,
          AppKey:            r.AppKey,
          Priority:          int32(r.Priority),
          Enabled:           r.Enabled,
          KeyBy:             r.KeyBy,
          Strategy:          r.Strategy,
          WindowSeconds:     int32(r.WindowSeconds),
          MaxRequests:       int32(r.MaxRequests),
          RequestsPerSecond: derefFloat64(r.RequestsPerSecond),
          Burst:             derefInt32(r.Burst),
          ClientTtlSeconds:  derefInt32(r.ClientTtlSeconds),
      }
  }

  func appKeyPtr(s string) *string {
      if s == "" {
          return nil
      }
      return &s
  }

  // float64Ptr converts a plain float64 to a pointer, matching sqlc's
  // nullable *float64 CreateRateLimitRuleParams fields.
  func float64Ptr(v float64) *float64 { return &v }

  // int32Ptr converts a plain int32 to a pointer, matching sqlc's nullable
  // *int32 CreateRateLimitRuleParams fields (burst, client_ttl_seconds).
  func int32Ptr(v int32) *int32 { return &v }

  // derefFloat64 returns the value of a nullable *float64, or 0 when nil.
  func derefFloat64(v *float64) float64 {
      if v == nil {
          return 0
      }
      return *v
  }

  // derefInt32 returns the value of a nullable *int32, or 0 when nil.
  func derefInt32(v *int32) int32 {
      if v == nil {
          return 0
      }
      return *v
  }

  func pickBestPattern(rules []gen.RateLimitRule, path string) *gen.RateLimitRule {
      for i := range rules {
          r := &rules[i]
          switch strings.ToLower(r.MatchKind) {
          case "exact":
              if r.PathPattern == path || r.Path == path {
                  return r
              }
          case "prefix":
              if strings.HasPrefix(path, r.PathPattern) {
                  return r
              }
          case "glob":
              if r.PathPattern != "" && globMatch(r.PathPattern, path) {
                  return r
              }
          case "regex":
              if r.PathPattern != "" && regexMatch(r.PathPattern, path) {
                  return r
              }
          default:
              if r.PathPattern == "*" || r.Path == "*" {
                  return r
              }
          }
      }
      return nil
  }

  func globMatch(pattern, path string) bool {
      parts := strings.Split(pattern, "*")
      idx := 0
      if !strings.HasPrefix(pattern, "*") {
          if !strings.HasPrefix(path, parts[0]) {
              return false
          }
          idx = len(parts[0])
          parts = parts[1:]
      }
      lastAnchored := !strings.HasSuffix(pattern, "*")
      for i, part := range parts {
          if part == "" {
              continue
          }
          pos := strings.Index(path[idx:], part)
          if pos < 0 {
              return false
          }
          idx += pos + len(part)
          if lastAnchored && i == len(parts)-1 && !strings.HasSuffix(path, part) {
              return false
          }
      }
      return true
  }

  func regexMatch(pattern, path string) bool {
      matched, err := regexp.MatchString(pattern, path)
      return err == nil && matched
  }
