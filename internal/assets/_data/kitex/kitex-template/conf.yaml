# Kitex custom template — base/conf.go
# Generates configuration loading and validation used by main.go/server wiring.
path: internal/base/conf/conf.go
update_behavior:
  type: cover
body: |-
  // Code generated by kitex generator.

  package conf

  import (
      "os"
      "path/filepath"
      "sync"
      "time"

      goerror "github.com/byx-darwin/go-tools/go-common/error"
      "github.com/byx-darwin/go-tools/go-framework/config"
      kitexconfig "github.com/byx-darwin/go-tools/go-framework/config/kitex"
      frameworkerror "github.com/byx-darwin/go-tools/go-framework/error"
      mwredis "github.com/byx-darwin/go-tools/go-middleware/redis"
  )

  var (
      current *Config
      once    sync.Once
      initErr error
  )

  type Config struct {
      Env      string                   `json:"env" yaml:"env"`
      Debug    bool                     `json:"debug" yaml:"debug"`
      Server   kitexconfig.ServerConfig `json:"server" yaml:"server"`
      RPC      RPCConfig                `json:"rpc" yaml:"rpc"`
      Auth     AuthConfig               `json:"auth" yaml:"auth"`
      Database DatabaseConfig           `json:"database" yaml:"database"`
      RateLimit RateLimitConfig         `json:"rate_limit" yaml:"rate_limit"`
      Log      LogConfig                `json:"log" yaml:"log"`
      Jaeger   *config.JaegerOption     `json:"jaeger" yaml:"jaeger"`
  }

  type LogConfig struct {
      Level  string `json:"level" yaml:"level"`
      Format string `json:"format" yaml:"format"`
      Mode   string `json:"mode" yaml:"mode"`
  }

  type RPCConfig struct {
      RequestTimeoutSeconds config.Duration `json:"request_timeout_seconds" yaml:"request_timeout_seconds"`
  }

  type AuthConfig struct {
      CallerAllowlist CallerAllowlistConfig `json:"caller_allowlist" yaml:"caller_allowlist"`
  }

  type CallerAllowlistConfig struct {
      Enabled        bool     `json:"enabled" yaml:"enabled"`
      Header         string   `json:"header" yaml:"header"`
      AllowedCallers []string `json:"allowed_callers" yaml:"allowed_callers"`
      AllowMissing   bool     `json:"allow_missing" yaml:"allow_missing"`
  }

  type DatabaseConfig struct {
      Enabled                  bool            `json:"enabled" yaml:"enabled"`
      DSN                      string          `json:"dsn" yaml:"dsn"`
      MaxConns                 int32           `json:"max_conns" yaml:"max_conns"`
      MinConns                 int32           `json:"min_conns" yaml:"min_conns"`
      MaxConnLifetimeSeconds   config.Duration `json:"max_conn_lifetime_seconds" yaml:"max_conn_lifetime_seconds"`
      MaxConnIdleTimeSeconds   config.Duration `json:"max_conn_idle_time_seconds" yaml:"max_conn_idle_time_seconds"`
      HealthCheckPeriodSeconds config.Duration `json:"health_check_period_seconds" yaml:"health_check_period_seconds"`
  }

  type RateLimitConfig struct {
      Enabled      bool                    `json:"enabled" yaml:"enabled"`
      Mode         string                  `json:"mode" yaml:"mode"`                 // shadow | enforce
      Static       StaticLimitConfig       `json:"static" yaml:"static"`
      RuleCenter   RateLimitRuleCenterConfig `json:"rule_center" yaml:"rule_center"`
      Source       RateLimitSourceConfig   `json:"source" yaml:"source"`
      GRPC         RateLimitGRPCConfig     `json:"grpc" yaml:"grpc"`
      Database     RateLimitDatabaseConfig `json:"database" yaml:"database"`
      Backend      string                  `json:"backend" yaml:"backend"`
      FailOpen     bool                    `json:"fail_open" yaml:"fail_open"`
      KeyPrefix    string                  `json:"key_prefix" yaml:"key_prefix"`
      AppKeyHeader string                  `json:"app_key_header" yaml:"app_key_header"`
      SkipPaths    []string                `json:"skip_paths" yaml:"skip_paths"`
      PreAuth      RateLimitPhaseConfig    `json:"pre_auth" yaml:"pre_auth"`
      PostAuth     RateLimitPhaseConfig    `json:"post_auth" yaml:"post_auth"`
      Memory       MemoryCacheConfig       `json:"memory" yaml:"memory"`
      Redis        RedisConfig    `json:"redis" yaml:"redis"`
  }

  type StaticLimitConfig struct {
      MaxQPS         int `json:"max_qps" yaml:"max_qps"`
      MaxConnections int `json:"max_connections" yaml:"max_connections"`
  }

  type RateLimitRuleCenterConfig struct {
      Address                  string          `json:"address" yaml:"address"`
      QueryTimeoutMilliseconds config.Duration `json:"query_timeout_milliseconds" yaml:"query_timeout_milliseconds"`
  }

  type RateLimitSourceConfig struct {
      Type            string          `json:"type" yaml:"type"`
      CacheTTLSeconds config.Duration `json:"cache_ttl_seconds" yaml:"cache_ttl_seconds"`
      FallbackOnError bool            `json:"fallback_on_error" yaml:"fallback_on_error"`
  }

  type RateLimitGRPCConfig struct {
      Target              string          `json:"target" yaml:"target"`
      TimeoutMilliseconds config.Duration `json:"timeout_milliseconds" yaml:"timeout_milliseconds"`
      AuthHeader          string          `json:"auth_header" yaml:"auth_header"`
      AuthToken           string          `json:"auth_token" yaml:"auth_token"`
      ServiceName         string          `json:"service_name" yaml:"service_name"`
  }

  type RateLimitDatabaseConfig struct {
      QueryTimeoutMilliseconds config.Duration `json:"query_timeout_milliseconds" yaml:"query_timeout_milliseconds"`
  }

  type RateLimitPhaseConfig struct {
      Enabled     bool                   `json:"enabled" yaml:"enabled"`
      DefaultRule RateLimitRuleConfig    `json:"default_rule" yaml:"default_rule"`
      Rules       []RateLimitMatchConfig `json:"rules" yaml:"rules"`
  }

  type RateLimitMatchConfig struct {
      AppKey      string              `json:"app_key" yaml:"app_key"`
      Method      string              `json:"method" yaml:"method"`
      MatchKind   string              `json:"match_kind" yaml:"match_kind"`
      Path        string              `json:"path" yaml:"path"`
      PathPattern string              `json:"path_pattern" yaml:"path_pattern"`
      PathPrefix  string              `json:"path_prefix" yaml:"path_prefix"`
      Priority    int                 `json:"priority" yaml:"priority"`
      Rule        RateLimitRuleConfig `json:"rule" yaml:"rule"`
  }

  type RateLimitRuleConfig struct {
      Enabled           bool            `json:"enabled" yaml:"enabled"`
      KeyBy             []string        `json:"key_by" yaml:"key_by"`
      Strategy          string          `json:"strategy" yaml:"strategy"`
      WindowSeconds     config.Duration `json:"window_seconds" yaml:"window_seconds"`
      MaxRequests       int             `json:"max_requests" yaml:"max_requests"`
      RequestsPerSecond float64         `json:"requests_per_second" yaml:"requests_per_second"`
      Burst             int             `json:"burst" yaml:"burst"`
      ClientTTLSeconds  config.Duration `json:"client_ttl_seconds" yaml:"client_ttl_seconds"`
  }

  type MemoryCacheConfig struct {
      MaxEntries int `json:"max_entries" yaml:"max_entries"`
  }

  type RedisConfig struct {
      Addrs           []string        `json:"addrs" yaml:"addrs"`
      Username        string          `json:"username" yaml:"username"`
      Password        string          `json:"password" yaml:"password"`
      DB              int             `json:"db" yaml:"db"`
      MasterName      string          `json:"master_name" yaml:"master_name"`
      SentinelUsername string         `json:"sentinel_username" yaml:"sentinel_username"`
      SentinelPassword string         `json:"sentinel_password" yaml:"sentinel_password"`
      Protocol        int             `json:"protocol" yaml:"protocol"`
      ClientName      string          `json:"client_name" yaml:"client_name"`
      PoolSize        int             `json:"pool_size" yaml:"pool_size"`
      MinIdleConns    int             `json:"min_idle_conns" yaml:"min_idle_conns"`
      DialTimeout     config.Duration `json:"dial_timeout" yaml:"dial_timeout"`
      ReadTimeout     config.Duration `json:"read_timeout" yaml:"read_timeout"`
      WriteTimeout    config.Duration `json:"write_timeout" yaml:"write_timeout"`
      PoolTimeout     config.Duration `json:"pool_timeout" yaml:"pool_timeout"`
      ConnMaxIdleTime config.Duration `json:"conn_max_idle_time" yaml:"conn_max_idle_time"`
      ConnMaxLifetime config.Duration `json:"conn_max_lifetime" yaml:"conn_max_lifetime"`
      MaxRetries      int             `json:"max_retries" yaml:"max_retries"`
      MinRetryBackoff config.Duration `json:"min_retry_backoff" yaml:"min_retry_backoff"`
      MaxRetryBackoff config.Duration `json:"max_retry_backoff" yaml:"max_retry_backoff"`
  }

  func (c RedisConfig) ToMiddlewareConfig() *mwredis.Config {
      return &mwredis.Config{
          Addrs:            c.Addrs,
          Username:         c.Username,
          Password:         c.Password,
          DB:               c.DB,
          MasterName:       c.MasterName,
          SentinelUsername: c.SentinelUsername,
          SentinelPassword: c.SentinelPassword,
          Protocol:         c.Protocol,
          ClientName:       c.ClientName,
          PoolSize:         c.PoolSize,
          MinIdleConns:     c.MinIdleConns,
          DialTimeout:      c.DialTimeout.Duration,
          ReadTimeout:      c.ReadTimeout.Duration,
          WriteTimeout:     c.WriteTimeout.Duration,
          PoolTimeout:      c.PoolTimeout.Duration,
          ConnMaxIdleTime:  c.ConnMaxIdleTime.Duration,
          ConnMaxLifetime:  c.ConnMaxLifetime.Duration,
          MaxRetries:       c.MaxRetries,
          MinRetryBackoff:  c.MinRetryBackoff.Duration,
          MaxRetryBackoff:  c.MaxRetryBackoff.Duration,
      }
  }

  func Init() error {
      once.Do(func() {
          current, initErr = Load()
      })
      return initErr
  }

  func Get() *Config { return current }

  func Load() (*Config, error) {
      cfg := Default()
      path := os.Getenv("CONFIG_PATH")
      fromEnv := path != ""
      if path == "" {
          path = filepath.Join("conf", Env(), "conf.yaml")
      }
      loaded, err := config.LoadYAML[Config](path)
      if err != nil {
          if os.IsNotExist(err) && !fromEnv {
              return cfg, nil
          }
          return nil, goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").With("path", path).Wrap(err)
      }
      *cfg = *loaded
      if err := cfg.Validate(); err != nil {
          return nil, err
      }
      return cfg, nil
  }

  func Default() *Config {
      return &Config{
          Env:   Env(),
          Debug: Env() != "prod",
          Server: kitexconfig.ServerConfig{
              RPC: &kitexconfig.RPCOption{
                  Port:    ":8888",
                  Network: "tcp",
              },
              Registry: &config.RegistryOption{
                  Name: "{{ToLower .ServiceInfo.ServiceName}}",
              },
              Timeout: &kitexconfig.ServerTimeout{
                  ReadWriteTimeout: 30 * time.Second,
                  ExitWaitTimeout:  10 * time.Second,
              },
          },
          RPC: RPCConfig{RequestTimeoutSeconds: config.Duration{Duration: 3 * time.Second}},
          Auth: AuthConfig{CallerAllowlist: CallerAllowlistConfig{Header: "x-caller-service"}},
          Database: DatabaseConfig{
              Enabled:                  false,
              MaxConns:                 20,
              MinConns:                 2,
              MaxConnLifetimeSeconds:   config.Duration{Duration: 1800 * time.Second},
              MaxConnIdleTimeSeconds:   config.Duration{Duration: 300 * time.Second},
              HealthCheckPeriodSeconds: config.Duration{Duration: 30 * time.Second},
          },
          RateLimit: RateLimitConfig{
              Enabled:      false,
              Source:       RateLimitSourceConfig{Type: "database", CacheTTLSeconds: config.Duration{Duration: 60 * time.Second}, FallbackOnError: true},
              GRPC:         RateLimitGRPCConfig{TimeoutMilliseconds: config.Duration{Duration: 200 * time.Millisecond}, ServiceName: "{{ToLower .ServiceInfo.ServiceName}}", AuthHeader: "Authorization"},
              Database:     RateLimitDatabaseConfig{QueryTimeoutMilliseconds: config.Duration{Duration: 200 * time.Millisecond}},
              Backend:      "memory",
              KeyPrefix:    "{{ToLower .ServiceInfo.ServiceName}}:rate_limit",
              AppKeyHeader: "x-app-key",
              SkipPaths:    []string{},
              PreAuth: RateLimitPhaseConfig{
                  Enabled: true,
                  DefaultRule: RateLimitRuleConfig{
                      Enabled: true, KeyBy: []string{"ip"}, Strategy: "fixed_window",
                      WindowSeconds: config.Duration{Duration: 60 * time.Second}, MaxRequests: 100, ClientTTLSeconds: config.Duration{Duration: 300 * time.Second},
                  },
                  Rules: []RateLimitMatchConfig{},
              },
              PostAuth: RateLimitPhaseConfig{Enabled: false, DefaultRule: RateLimitRuleConfig{Enabled: true}, Rules: []RateLimitMatchConfig{}},
              Memory:  MemoryCacheConfig{MaxEntries: 1000},
              Redis:   RedisConfig{},
          },
          Log: LogConfig{
              Level:  "info",
              Format: "json",
              Mode:   "both",
          },
      }
  }

  func (c *Config) Validate() error {
      if c.Server.Registry.Name == "" {
          return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("server.registry.name is empty")
      }
      if c.Server.RPC.Port == "" {
          return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("server.rpc.port is empty")
      }
      if c.Server.Timeout.ReadWriteTimeout <= 0 || c.Server.Timeout.ExitWaitTimeout <= 0 || c.RPC.RequestTimeoutSeconds.Duration < 0 {
          return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("timeout values must be positive")
      }
      if c.Auth.CallerAllowlist.Enabled {
          if c.Auth.CallerAllowlist.Header == "" {
              return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("auth.caller_allowlist.header is empty")
          }
          if !c.Auth.CallerAllowlist.AllowMissing && len(c.Auth.CallerAllowlist.AllowedCallers) == 0 {
              return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("auth.caller_allowlist.allowed_callers is empty")
          }
      }
      if c.Database.Enabled {
          if c.Database.DSN == "" {
              return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("database.dsn is empty")
          }
          if c.Database.MaxConns < 0 || c.Database.MinConns < 0 || c.Database.MaxConnLifetimeSeconds.Duration < 0 || c.Database.MaxConnIdleTimeSeconds.Duration < 0 || c.Database.HealthCheckPeriodSeconds.Duration < 0 {
              return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("database pool settings must not be negative")
          }
      }
      if c.RateLimit.Enabled {
          switch c.RateLimit.Source.Type {
          case "", "config", "database", "rule_center", "grpc":
          default:
              return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("rate_limit.source.type must be config, database, rule_center, or grpc")
          }
          if c.RateLimit.Source.Type == "grpc" && c.RateLimit.GRPC.Target == "" {
              return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("rate_limit.grpc.target is empty")
          }
          switch c.RateLimit.Backend {
          case "memory", "redis":
          default:
              return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("rate_limit.backend must be memory or redis")
          }
      }
      return nil
  }

  func Env() string {
      if env := os.Getenv("GO_ENV"); env != "" {
          return env
      }
      return "dev"
  }
