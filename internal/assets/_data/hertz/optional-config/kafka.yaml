# Optional Kafka config block for Hertz.
# Keep the same top-level structure in conf/dev/conf.yaml and in your config-center payload.
# Adjust these defaults to match how you wire internal/base/data/kafka.go.
kafka:
  producer:
    enabled: false
    brokers:
      - 127.0.0.1:9092
    topic: demo-events
    balancer: hash # hash | least_bytes | round_robin
    required_acks: -1
    async: false
    batch_size: 100
    batch_bytes: 1048576
    batch_timeout_milliseconds: 10
  consumer:
    enabled: false
    brokers:
      - 127.0.0.1:9092
    group_id: demo
    topic: demo-events
    queue_capacity: 100
    min_bytes: 10000
    max_bytes: 10485760
    max_wait_milliseconds: 500
    start_offset: -1
