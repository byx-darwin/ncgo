# Optional ClickHouse config block for Hertz.
# Keep the same top-level structure in conf/dev/conf.yaml and in your config-center payload.
# Adjust these defaults to match how you wire internal/base/data/clickhouse.go.
clickhouse:
  enabled: false
  addr:
    - 127.0.0.1:9000
  protocol: native # native | http
  database: default
  username: default
  password: ""
  dial_timeout_seconds: 5
  max_open_conns: 5
  max_idle_conns: 5
  conn_max_lifetime_seconds: 300
  block_buffer_size: 2
  compress: lz4 # none | lz4 | gzip | deflate | br | zstd
